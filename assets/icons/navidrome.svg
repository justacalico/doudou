<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" aria-labelledby="title desc" role="img">
  <title id="title">Vinyl Disc Icon</title>
  <desc id="desc">Simple, realistic vinyl record disc with grooves and center label</desc>

  <defs>
    <!-- Radial gradients for vinyl shine and label -->
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="70%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="shine" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="label" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B39F"/>
      <stop offset="100%" stop-color="#2D2B8A"/>
    </radialGradient>
  </defs>

  <!-- Outer vinyl disc -->
  <circle cx="512" cy="512" r="450" fill="url(#vinyl)"/>

  <!-- Subtle highlight -->
  <circle cx="512" cy="512" r="450" fill="url(#shine)"/>

  <!-- Grooves (thin concentric rings) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none">
    <circle cx="512" cy="512" r="420"/>
    <circle cx="512" cy="512" r="380"/>
    <circle cx="512" cy="512" r="340"/>
    <circle cx="512" cy="512" r="300"/>
    <circle cx="512" cy="512" r="260"/>
    <circle cx="512" cy="512" r="220"/>
    <circle cx="512" cy="512" r="180"/>
  </g>

  <!-- Center label -->
  <circle cx="512" cy="512" r="120" fill="url(#label)"/>

  <!-- Center spindle hole -->
  <circle cx="512" cy="512" r="20" fill="#FFFFFF" opacity="0.85"/>
</svg>
