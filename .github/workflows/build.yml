name: Build

on:
  push:
    branches: ["**"]
    tags: ['v*']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-phone
            os: ubuntu-latest
          - target: android-phone-playstore
            os: ubuntu-latest
          - target: android-wear
            os: ubuntu-latest
          - target: android-tv-playstore
            os: ubuntu-latest
          - target: android-tv-nonplaystore
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
          - target: doudou-server-linux
            os: ubuntu-latest
          - target: doudou-server-windows
            os: windows-latest
          - target: doudou-server-macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        if: startsWith(matrix.target, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Linux build dependencies
        if: matrix.target == 'linux' || matrix.target == 'doudou-server-linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libsecret-1-dev libmpv-dev \
            libayatana-appindicator3-dev \
            dpkg-dev rpm wget file squashfs-tools patchelf libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Install doudou-server dependencies
        if: startsWith(matrix.target, 'doudou-server-')
        working-directory: packages/doudou_server
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build debug + release
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA-}"
          [ -n "$short_sha" ] && short_sha="${short_sha::7}" || short_sha="local"
          tag="${GITHUB_REF#refs/tags/}"
          [ "$tag" = "$GITHUB_REF" ] && tag=""
          suffix="$short_sha"
          [ -n "$tag" ] && suffix="$tag"
          mkdir -p artifacts

          build_apk() {
            local flavor="$1" name="$2"; shift 2
            flutter build apk --debug --flavor "$flavor" "$@"
            cp "build/app/outputs/flutter-apk/app-${flavor}-debug.apk" \
               "artifacts/doudou-${name}-debug-${suffix}.apk"
            flutter build apk --release --flavor "$flavor" "$@"
            cp "build/app/outputs/flutter-apk/app-${flavor}-release.apk" \
               "artifacts/doudou-${name}-release-${suffix}.apk"
          }

          case "${{ matrix.target }}" in
            android-phone)
              build_apk phone phone -t lib/main.dart
              ;;
            android-phone-playstore)
              build_apk phone phone-playstore --dart-define=PLAYSTORE=true -Pplaystore=true -t lib/main.dart
              flutter build appbundle --release --flavor phone --dart-define=PLAYSTORE=true -Pplaystore=true -t lib/main.dart
              cp build/app/outputs/bundle/phoneRelease/app-phone-release.aab \
                 "artifacts/doudou-phone-playstore-release-${suffix}.aab"
              ;;
            android-wear)
              build_apk wear wear -t lib/main_wear.dart
              ;;
            android-tv-playstore)
              build_apk tv tv-playstore --dart-define=PLAYSTORE=true --dart-define=TV=true
              flutter build appbundle --release --flavor tv --dart-define=PLAYSTORE=true --dart-define=TV=true
              cp build/app/outputs/bundle/tvRelease/app-tv-release.aab \
                 "artifacts/doudou-tv-playstore-release-${suffix}.aab"
              ;;
            android-tv-nonplaystore)
              build_apk tv tv --dart-define=PLAYSTORE=false --dart-define=TV=true
              ;;
            linux)
              flutter build linux --debug
              tar -czf "artifacts/doudou-linux-debug-${suffix}.tar.gz" -C build/linux/x64/debug/bundle .
              flutter build linux --release
              tar -czf "artifacts/doudou-linux-release-${suffix}.tar.gz" -C build/linux/x64/release/bundle .
              ;;
            windows)
              flutter build windows --debug
              7z a "artifacts/doudou-windows-debug-${suffix}.zip" "build/windows/x64/runner/Debug"
              flutter build windows --release
              7z a "artifacts/doudou-windows-release-${suffix}.zip" "build/windows/x64/runner/Release"
              ;;
            macos)
              flutter build macos --debug
              (cd build/macos/Build/Products/Debug && zip -ry "$OLDPWD/artifacts/doudou-macos-debug-${suffix}.zip" ./*.app)
              flutter build macos --release
              (cd build/macos/Build/Products/Release && zip -ry "$OLDPWD/artifacts/doudou-macos-release-${suffix}.zip" ./*.app)
              ;;
            ios)
              flutter build ios --debug --no-codesign
              (cd build/ios/iphoneos && zip -ry "$OLDPWD/artifacts/doudou-ios-debug-${suffix}.zip" ./*.app)
              flutter build ios --release --no-codesign
              (cd build/ios/iphoneos && zip -ry "$OLDPWD/artifacts/doudou-ios-release-${suffix}.zip" ./*.app)
              ;;
            doudou-server-linux)
              (cd packages/doudou_server && flutter build linux --debug)
              tar -czf "artifacts/doudou-server-linux-debug-${suffix}.tar.gz" -C packages/doudou_server/build/linux/x64/debug/bundle .
              (cd packages/doudou_server && flutter build linux --release)
              tar -czf "artifacts/doudou-server-linux-release-${suffix}.tar.gz" -C packages/doudou_server/build/linux/x64/release/bundle .
              ;;
            doudou-server-windows)
              (cd packages/doudou_server && flutter build windows --debug)
              (cd packages/doudou_server/build/windows/x64/runner/Debug && 7z a "$OLDPWD/artifacts/doudou-server-windows-debug-${suffix}.zip" "*")
              (cd packages/doudou_server && flutter build windows --release)
              (cd packages/doudou_server/build/windows/x64/runner/Release && 7z a "$OLDPWD/artifacts/doudou-server-windows-release-${suffix}.zip" "*")
              ;;
            doudou-server-macos)
              (cd packages/doudou_server && flutter build macos --debug)
              (cd packages/doudou_server/build/macos/Build/Products/Debug && zip -ry "$OLDPWD/artifacts/doudou-server-macos-debug-${suffix}.zip" ./*.app)
              (cd packages/doudou_server && flutter build macos --release)
              (cd packages/doudou_server/build/macos/Build/Products/Release && zip -ry "$OLDPWD/artifacts/doudou-server-macos-release-${suffix}.zip" ./*.app)
              ;;
            *)
              echo "Unknown target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doudou-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/v') && contains(needs.build.result, 'success') }}
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets/)" ]; then
            echo "No artifacts found — skipping release"
            exit 1
          fi
          ls -la release-assets/

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from commit ${{ github.sha }}

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Built on:** ${{ github.event.head_commit.timestamp }}

            > This release is automatically updated on every push. Artifacts are untested nightly builds.
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish Tagged Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && contains(needs.build.result, 'success') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets/)" ]; then
            echo "No artifacts found — skipping release"
            exit 1
          fi
          ls -la release-assets/

      - name: Create tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
