name: Build

# Runs on GitLab as a downstream mirror. Triggers:
#   - every push to main (every commit builds)
#   - nightly schedule (02:00 UTC)
#   - every tag v* (cut a permanent release so people can go back in time)
#   - manual dispatch
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  ARTIFACT_RETENTION: 30

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-phone
            target: android-phone
            runs-on: ubuntu-latest
          - name: android-phone-playstore
            target: android-phone-playstore
            runs-on: ubuntu-latest
          - name: android-wear
            target: android-wear
            runs-on: ubuntu-latest
          - name: android-tv-playstore
            target: android-tv-playstore
            runs-on: ubuntu-latest
          - name: android-tv-nonplaystore
            target: android-tv-nonplaystore
            runs-on: ubuntu-latest
          - name: linux
            target: linux
            runs-on: ubuntu-latest
          - name: windows
            target: windows
            runs-on: windows-latest
          - name: macos
            target: macos
            runs-on: macos-latest
          - name: ios
            target: ios
            runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: startsWith(matrix.target, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libsecret-1-dev libmpv-dev \
            libayatana-appindicator3-dev \
            dpkg-dev rpm wget file squashfs-tools patchelf libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build (debug + release)
        id: build
        shell: bash
        run: .github/workflows/build-target.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doudou-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            release-assets/*
