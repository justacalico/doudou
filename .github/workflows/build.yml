name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a nightly release from this build (leave unchecked for plain branch builds)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: false
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-phone
            os: ubuntu-latest
            artifact: doudou-android
          - target: android-phone-playstore
            os: ubuntu-latest
            artifact: doudou-playstore-android
          - target: android-wear
            os: ubuntu-latest
            artifact: doudou-wearos
          - target: android-tv-playstore
            os: ubuntu-latest
            artifact: doudou-tv-playstore
          - target: android-tv
            os: ubuntu-latest
            artifact: doudou-tv
          - target: linux-x64
            os: ubuntu-latest
            artifact: doudou-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            artifact: doudou-linux-arm64
          - target: windows
            os: windows-latest
            artifact: doudou-windows
          - target: macos
            os: macos-latest
            artifact: doudou-macos
          - target: ios
            os: macos-latest
            artifact: doudou-ios

    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: startsWith(matrix.target, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: matrix.target != 'linux-arm64'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter manually (ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libsecret-1-dev libmpv-dev \
            libayatana-appindicator3-dev \
            dpkg-dev rpm wget file squashfs-tools patchelf libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop

      - name: Install appimagetool (x64)
        if: matrix.target == 'linux-x64'
        run: |
          wget -q -O /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install appimagetool (arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          wget -q -O /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install Rust
        if: matrix.target == 'ios'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install iOS Rust targets
        if: matrix.target == 'ios'
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Fix RepeatMode conflict with Flutter
        if: startsWith(matrix.target, 'android') || matrix.target == 'ios' || matrix.target == 'macos'
        shell: bash
        run: |
          AUDIO_HANDLER="lib/services/audio/unified_audio_handler.dart"
          if [ -f "$AUDIO_HANDLER" ]; then
            perl -i -pe 's/\bRepeatMode\b/AudioRepeatMode/g' "$AUDIO_HANDLER"
            find lib -name "*.dart" -exec grep -l "unified_audio_handler" {} \; | while read f; do
              [ "$f" = "$AUDIO_HANDLER" ] || ! grep -q '\bRepeatMode\b' "$f" || perl -i -pe 's/\bRepeatMode\b/AudioRepeatMode/g' "$f"
            done
          fi

      - name: Setup Android signing
        id: signing
        if: startsWith(matrix.target, 'android')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DOUDOU_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DOUDOU_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.DOUDOU_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.DOUDOU_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "No keystore configured, using debug signing"
            exit 0
          fi

          echo "Setting up release signing..."
          STORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r')
          KEY_PASSWORD=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r')
          KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r')

          mkdir -p android/keystore android/app/keystore
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/keystore/upload-keystore.jks 2>/dev/null; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Keystore base64 is invalid, using debug signing"
            exit 0
          fi
          cp android/keystore/upload-keystore.jks android/app/keystore/upload-keystore.jks
          KEYSTORE_ABS_PATH="$PWD/android/keystore/upload-keystore.jks"

          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=$KEYSTORE_ABS_PATH" > android/key.properties
          cp android/key.properties android/app/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"
          echo "Release signing is configured"

      - name: Validate Android keystore
        if: startsWith(matrix.target, 'android') && steps.signing.outputs.signing == 'release'
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(grep '^storePassword=' android/key.properties | cut -d'=' -f2-)
          KEY_PASSWORD=$(grep '^keyPassword=' android/key.properties | cut -d'=' -f2-)
          KEY_ALIAS=$(grep '^keyAlias=' android/key.properties | cut -d'=' -f2-)
          STORE_FILE=$(grep '^storeFile=' android/key.properties | cut -d'=' -f2-)

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_FILE" ]; then
            echo "key.properties is missing required keystore fields"
            exit 1
          fi

          if [ ! -f "$STORE_FILE" ]; then
            echo "Keystore file not found for storeFile=$STORE_FILE"
            exit 1
          fi

          echo "Validating release keystore and alias..."
          keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          echo "Android keystore validation passed"

      - name: Enable Windows Developer Mode
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -PropertyType DWORD -Force

      - name: Patch clipboard plugin (Windows C4189)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cache="${PUB_CACHE:-$HOME/.pub-cache}"
          [ -d "$cache" ] || cache="/c/Users/$USER/AppData/Local/Pub/Cache"
          f=$(find "$cache" -name "clipboard_plugin.cpp" -path "*/clipboard/*" 2>/dev/null | head -1)
          if [ -n "$f" ] && grep -q "headerSize" "$f"; then
            sed -i.bak '/headerSize.*=/a\  (void)headerSize;' "$f" && rm -f "${f}.bak" || true
          fi

      - name: Patch plugin CMake for Windows symlink extraction
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          $smtc = Get-ChildItem -Path "$env:PUB_CACHE\hosted\pub.dev" -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match "smtc_windows-[\d.]+\\windows\\CMakeLists\.txt" } |
                    Select-Object -First 1
          if ($smtc) {
            $txt = Get-Content $smtc.FullName -Raw
            if ($txt -notmatch 'file\(REAL_PATH "\$\{CMAKE_CURRENT_SOURCE_DIR\}" REAL_SOURCE_DIR\)') {
              $txt = $txt -replace 'set\(LibRoot "\$\{CMAKE_CURRENT_SOURCE_DIR\}/\$\{LibraryVersion\}"\)',
                                 "file(REAL_PATH `"`${CMAKE_CURRENT_SOURCE_DIR}`" REAL_SOURCE_DIR)`r`nset(LibRoot `"`${REAL_SOURCE_DIR}/`${LibraryVersion}`")"
              Set-Content $smtc.FullName -Value $txt -NoNewline
            }
          }
          $audio = Get-ChildItem -Path "$env:PUB_CACHE\hosted\pub.dev" -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "audiotags-[\d.]+\\windows\\CMakeLists\.txt" } |
                     Select-Object -First 1
          if ($audio) {
            $txt = Get-Content $audio.FullName -Raw
            if ($txt -notmatch 'file\(REAL_PATH "\$\{CMAKE_CURRENT_SOURCE_DIR\}" REAL_SOURCE_DIR\)') {
              $txt = $txt -replace 'set\(LibPath "\$\{CMAKE_CURRENT_SOURCE_DIR\}/windows\.tar\.gz"\)',
                                 "file(REAL_PATH `"`${CMAKE_CURRENT_SOURCE_DIR}`" REAL_SOURCE_DIR)`r`nset(LibPath `"`${REAL_SOURCE_DIR}/windows.tar.gz`")"
              $txt = $txt -replace '\$\{CMAKE_CURRENT_SOURCE_DIR\}/audiotags\.dll', '${REAL_SOURCE_DIR}/audiotags.dll'
              $txt = $txt -replace 'WORKING_DIRECTORY \$\{CMAKE_CURRENT_SOURCE_DIR\}', 'WORKING_DIRECTORY ${REAL_SOURCE_DIR}'
              Set-Content $audio.FullName -Value $txt -NoNewline
            }
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Run iOS prebuild patches
        if: matrix.target == 'ios'
        run: bash scripts/build-ios.sh

      - name: Run flutter_rust_bridge codegen
        if: matrix.target == 'ios'
        continue-on-error: true
        run: dart run flutter_rust_bridge_codegen build-ios --release

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS: 1
        run: |
          set -euo pipefail
          mkdir -p artifacts

          build_apk() {
            local flavor="$1" name="$2"; shift 2
            flutter build apk --release --flavor "$flavor" "$@" --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            cp "build/app/outputs/flutter-apk/app-${flavor}-release.apk" \
               "artifacts/doudou-${name}-${VERSION}-${BUILD_DATE}.apk"
          }

          build_aab() {
            local flavor="$1" name="$2"; shift 2
            flutter build appbundle --release --flavor "$flavor" "$@" --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            cp "build/app/outputs/bundle/${flavor}Release/app-${flavor}-release.aab" \
               "artifacts/doudou-${name}-${VERSION}-${BUILD_DATE}.aab"
          }

          case "${{ matrix.target }}" in
            android-phone)
              build_apk phone phone -t lib/main.dart
              build_aab phone phone -t lib/main.dart
              ;;
            android-phone-playstore)
              build_aab phone phone-playstore --dart-define=PLAYSTORE=true -Pplaystore=true -t lib/main.dart
              ;;
            android-wear)
              build_apk wear wear -t lib/main_wear.dart
              build_aab wear wear -t lib/main_wear.dart
              ;;
            android-tv-playstore)
              build_apk tv tv-playstore --dart-define=PLAYSTORE=true --dart-define=TV=true
              build_aab tv tv-playstore --dart-define=PLAYSTORE=true --dart-define=TV=true
              ;;
            android-tv)
              build_apk tv tv --dart-define=PLAYSTORE=false --dart-define=TV=true
              build_aab tv tv --dart-define=PLAYSTORE=false --dart-define=TV=true
              ;;
            linux-x64)
              flutter build linux --release --build-name="$VERSION"
              cd build/linux/x64/release && zip -r "$GITHUB_WORKSPACE/artifacts/doudou-linux-x64-${VERSION}-${BUILD_DATE}.zip" bundle/ && cd "$GITHUB_WORKSPACE"
              export PATH="$PATH:$HOME/.pub-cache/bin"
              dart pub global activate fastforge
              fastforge package --platform linux --targets deb --skip-clean || echo "DEB build had warnings"
              fastforge package --platform linux --targets rpm --skip-clean || echo "RPM build had warnings"
              fastforge package --platform linux --targets appimage --skip-clean || echo "AppImage build had warnings"
              find dist -name "*.deb" -exec cp {} "artifacts/doudou-linux-amd64-${VERSION}-${BUILD_DATE}.deb" \; 2>/dev/null || true
              find dist -name "*.rpm" -exec cp {} "artifacts/doudou-linux-amd64-${VERSION}-${BUILD_DATE}.rpm" \; 2>/dev/null || true
              find dist -name "*.AppImage" -exec cp {} "artifacts/doudou-linux-x86_64-${VERSION}-${BUILD_DATE}.AppImage" \; 2>/dev/null || true
              ;;
            linux-arm64)
              flutter build linux --release --build-name="$VERSION"
              cd build/linux/arm64/release && zip -r "$GITHUB_WORKSPACE/artifacts/doudou-linux-arm64-${VERSION}-${BUILD_DATE}.zip" bundle/ && cd "$GITHUB_WORKSPACE"
              export PATH="$PATH:$HOME/.pub-cache/bin"
              export PUB_CACHE="$HOME/.pub-cache"
              dart pub global activate fastforge
              fastforge package --platform linux --targets deb --skip-clean || echo "DEB build had warnings"
              fastforge package --platform linux --targets rpm --skip-clean || echo "RPM build had warnings"
              fastforge package --platform linux --targets appimage --skip-clean || echo "AppImage build had warnings"
              find dist -name "*.deb" -exec cp {} "artifacts/doudou-linux-arm64-${VERSION}-${BUILD_DATE}.deb" \; 2>/dev/null || true
              find dist -name "*.rpm" -exec cp {} "artifacts/doudou-linux-arm64-${VERSION}-${BUILD_DATE}.rpm" \; 2>/dev/null || true
              find dist -name "*.AppImage" -exec cp {} "artifacts/doudou-linux-aarch64-${VERSION}-${BUILD_DATE}.AppImage" \; 2>/dev/null || true
              ;;
            windows)
              flutter build windows --release
              7z a "artifacts/doudou-windows-${VERSION}-${BUILD_DATE}.zip" "build/windows/x64/runner/Release"
              ;;
            macos)
              flutter config --enable-macos-desktop
              flutter build macos --release --build-name="$VERSION"
              ;;
            ios)
              flutter build ios --release --no-codesign
              ;;
            *)
              echo "Unknown target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          ls -la artifacts/

      - name: Disable macOS code signing in Xcode project
        if: matrix.target == 'macos'
        run: |
          cd macos
          /usr/libexec/PlistBuddy -c "Set :buildSettings:CODE_SIGN_IDENTITY ''" Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath ../build/macos_unsigned || true

      - name: Create macOS ZIP
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/artifacts/doudou-macos-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-unsigned.zip" *.app

      - name: Create iOS IPA
        if: matrix.target == 'ios'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "artifacts/doudou-ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-unsigned.ipa" Payload/
          rm -rf Payload

      - name: Create Windows installer
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          @"
          [Setup]
          AppName=Doudou
          AppVersion=${{ steps.version.outputs.version }}
          AppPublisher=Openlyst
          DefaultDirName={autopf}\Doudou
          DefaultGroupName=Doudou
          OutputDir=artifacts
          OutputBaseFilename=doudou-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          UninstallDisplayIcon={app}\doudou.exe
          PrivilegesRequired=lowest

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Doudou"; Filename: "{app}\doudou.exe"
          Name: "{group}\{cm:UninstallProgram,Doudou}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\Doudou"; Filename: "{app}\doudou.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\doudou.exe"; Description: "{cm:LaunchProgram,Doudou}"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath installer.iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Android signature
        if: startsWith(matrix.target, 'android') && steps.signing.outputs.signing == 'release'
        shell: bash
        run: |
          for pkg in artifacts/*.apk artifacts/*.aab; do
            [ -f "$pkg" ] || continue
            echo "Verifying $pkg..."
            if command -v apksigner >/dev/null 2>&1; then
              apksigner verify "$pkg" >/dev/null 2>&1 || { echo "Signature verification failed: $pkg"; exit 1; }
            else
              jarsigner -verify "$pkg" >/dev/null 2>&1 || { echo "Signature verification failed: $pkg"; exit 1; }
            fi
            echo "Verified: $pkg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: build
    # Skip on tag pushes (handled by the release job) and PR builds.
    # On manual dispatch, only publish when create_release is explicitly
    # checked — plain branch builds just produce artifacts, no release.
    if: ${{ !cancelled() && contains(needs.build.result, 'success') && !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/pull/') && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)) }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_DATE=$(date +%Y-%m-%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.ipa" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view nightly -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset nightly -R "$GITHUB_REPOSITORY" "$asset" --yes 2>/dev/null || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from the latest commit on main.

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.version.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            > This release is automatically updated on every push to main. Artifacts are untested nightly builds.
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && contains(needs.build.result, 'success') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.ipa" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Doudou v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Doudou v${{ steps.version.outputs.version }}

            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.version.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            ### Artifacts
            - Android Phone: APK + AAB (release signed)
            - Android Play Store: AAB (release signed)
            - Android Wear OS: APK + AAB (release signed)
            - Android TV: APK + AAB (release signed)
            - Android TV Play Store: APK + AAB (release signed)
            - Linux x64: zip + deb + rpm + AppImage
            - Linux arm64: zip + deb + rpm + AppImage
            - Windows: zip + installer
            - macOS: zip (unsigned)
            - iOS: IPA (unsigned)

            ### Verification
            SHA256 checksums are in `SHA256SUMS.txt`. Verify with:
            ```
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
