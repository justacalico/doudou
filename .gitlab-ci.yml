stages:
  - build
  - build-linux
  - release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"

cache:
  key: "$CI_COMMIT_REF_SLUG-v2"
  paths:
    - .pub-cache/
  policy: pull-push

build_debug_apk:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Fully clean build artifacts, caches, and temp directories
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies
    - rm -rf .pub-cache # Completely delete pub-cache to prevent temp file errors
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons
    - pkill -f gradle || true
    # Fetch dependencies safely
    - flutter pub get
    - flutter build apk --debug
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build_debug_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  needs:
    - job: "build_debug_apk"
      optional: true
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  before_script:
    # Install Linux desktop development dependencies
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get
    - flutter build linux --debug
  artifacts:
    paths:
      - build/linux/x64/debug/bundle/
    expire_in: 1 week

build_debug_macos:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-macos-desktop
    - flutter clean
    - flutter pub get
    # If the Flutter SDK in this environment doesn't support `flutter build macos`,
    # detect and skip the macOS build to avoid a failing job on non-macOS runners.
    - |
      if ! flutter help build | grep -q "macos"; then
        echo "macOS build not supported in this environment (skipping)."
        exit 0
      fi
    # Prevent system sleep during build
    - caffeinate -i flutter build macos
  artifacts:
    paths:
      - build/macos/Build/Products/Debug/
    expire_in: 1 week

build_debug_ios:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    - flutter pub get
    # Prevent system sleep during build
    - caffeinate -i flutter build ios --no-codesign
  artifacts:
    paths:
      - build/ios/iphoneos/
    expire_in: 1 week

publish_release:
  stage: release
  tags:
    - apple # Use the same macOS runner that ran the builds
  needs:
    - job: "build_debug_apk"
    - job: "build_debug_linux"
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  # allow_failure: false # Change to false once permissions are confirmed, but left as true for safety.
  
  before_script:
    # Install release-cli if not available, with fallback to API approach
    - |
      if ! command -v release-cli &> /dev/null; then
        echo "Installing GitLab release-cli..."
        # Try to download and install release-cli
        if curl -L "https://gitlab.com/gitlab-org/release-cli/-/releases/permalink/latest/downloads/release-cli-darwin-amd64" -o release-cli 2>/dev/null; then
          chmod +x release-cli
          sudo mv release-cli /usr/local/bin/ 2>/dev/null || mv release-cli ./release-cli
          export PATH=".:$PATH"
        else
          echo "Failed to install release-cli, will use API fallback"
        fi
      fi
    - |
      if command -v release-cli &> /dev/null; then
        release-cli version
        export USE_RELEASE_CLI=true
      else
        echo "Using GitLab API fallback for release creation"
        export USE_RELEASE_CLI=false
      fi
  
  script:
    - echo "Creating release for pipeline $CI_PIPELINE_ID with artifacts..."

    # Define release tag and notes variables
    - RELEASE_TAG="pipeline-$CI_PIPELINE_ID"
    - RELEASE_NOTES="Automated debug release for pipeline $CI_PIPELINE_ID from commit $CI_COMMIT_SHORT_SHA"

    # Create release using either release-cli or API fallback
    - |
      if [ "$USE_RELEASE_CLI" = "true" ]; then
        echo "Using release-cli..."
        # Construct the assets list for all uploaded artifacts
        ASSETS_LIST=""
        ASSETS_LIST="$ASSETS_LIST --asset-link \"{\\\"name\\\":\\\"Android APK\\\",\\\"url\\\":\\\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$build_debug_apk/artifacts/raw/build/app/outputs/flutter-apk/app-debug.apk\\\"}\""
        ASSETS_LIST="$ASSETS_LIST --asset-link \"{\\\"name\\\":\\\"Linux Build\\\",\\\"url\\\":\\\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$build_debug_linux/artifacts/raw/build/linux/x64/debug/bundle/\\\"}\""
        
        # Optional assets (using shell to conditionally add macOS/iOS links)
        if [ "$build_debug_macos" ]; then
          ASSETS_LIST="$ASSETS_LIST --asset-link \"{\\\"name\\\":\\\"macOS Build\\\",\\\"url\\\":\\\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$build_debug_macos/artifacts/raw/build/macos/Build/Products/Debug/\\\"}\""
        fi
        if [ "$build_debug_ios" ]; then
          ASSETS_LIST="$ASSETS_LIST --asset-link \"{\\\"name\\\":\\\"iOS Build\\\",\\\"url\\\":\\\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$build_debug_ios/artifacts/raw/build/ios/iphoneos/\\\"}\""
        fi

        # Execute release-cli command
        release-cli create \
          --name "Release Pipeline $CI_PIPELINE_ID" \
          --tag "$RELEASE_TAG" \
          --description "$RELEASE_NOTES" \
          --ref "$CI_COMMIT_SHA" \
          $ASSETS_LIST
      else
        echo "Using GitLab API fallback..."
        # Create release using GitLab API directly
        curl --header "Content-Type: application/json" \
             --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
             --data '{
               "name": "Release Pipeline '"$CI_PIPELINE_ID"'",
               "tag_name": "'"$RELEASE_TAG"'",
               "description": "'"$RELEASE_NOTES"'",
               "ref": "'"$CI_COMMIT_SHA"'",
               "assets": {
                 "links": [
                   {
                     "name": "Android APK",
                     "url": "'"$CI_SERVER_URL/$CI_PROJECT_PATH"'/-/jobs/artifacts/'"$CI_COMMIT_REF_NAME"'/raw/build/app/outputs/flutter-apk/app-debug.apk?job=build_debug_apk"
                   },
                   {
                     "name": "Linux Build", 
                     "url": "'"$CI_SERVER_URL/$CI_PROJECT_PATH"'/-/jobs/artifacts/'"$CI_COMMIT_REF_NAME"'/download?job=build_debug_linux"
                   }
                 ]
               }
             }' \
             --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      fi