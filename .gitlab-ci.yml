spec:
  inputs:
    build_all:
      type: boolean
      default: false
      description: 'Build all Android variants (wear, tv, playstore) in addition to phone and linux'
    create_release:
      type: boolean
      default: false
      description: 'Create a versioned release (requires build_all)'

---

stages:
  - sync
  - release

github-sync:
  stage: sync
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:justacalico/doudou.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG"
      else
        git push github HEAD:main
      fi

github-dispatch:
  stage: sync
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - |
      gh auth login --hostname github.com --git-protocol https --with-token < <(echo "$GH_TOKEN")
  script:
    - |
      if [ "$[[ inputs.create_release ]]" = "true" ] || [ "$[[ inputs.build_all ]]" = "true" ]; then
        gh workflow run build.yml -R justacalico/doudou -f create_release=true
      else
        gh workflow run build.yml -R justacalico/doudou
      fi

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
  variables:
    GH_TOKEN: $GH_TOKEN
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash scripts/sync-from-github.sh
