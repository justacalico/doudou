stages:
- build
- release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"

cache:
  - key: "$CI_COMMIT_REF_SLUG-pub-cache"
    paths:
      - .pub-cache/
    policy: pull-push
  - key: "$CI_COMMIT_REF_SLUG-gradle-cache"  
    paths:
      - android/.gradle/
    policy: pull-push

build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Clean up any problematic files/directories before starting
    - rm -rf build/ || true
    - rm -rf .dart_tool/ || true
    - rm -rf android/.gradle || true
    - rm -rf android/.kotlin || true
    - rm -rf .flutter-plugins-dependencies || true
    # Clean pub cache if it exists and seems corrupted
    - if [ -d ".pub-cache" ]; then rm -rf .pub-cache/_temp || true; fi
    - flutter clean || true
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons and clean gradle cache
    - pkill -f gradle || true
    # Clean pub cache completely if pub get fails, then retry
    - flutter pub get || (rm -rf .pub-cache && flutter pub get)
    - flutter build apk --debug --verbose
  after_script:
    # Always kill gradle daemons after build
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build_release_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Clean up any problematic files/directories before starting
    - rm -rf build/ || true
    - rm -rf .dart_tool/ || true
    - rm -rf android/.gradle || true
    - rm -rf android/.kotlin || true
    - rm -rf .flutter-plugins-dependencies || true
    # Clean pub cache if it exists and seems corrupted
    - if [ -d ".pub-cache" ]; then rm -rf .pub-cache/_temp || true; fi
    - flutter clean || true
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons and clean gradle cache
    - pkill -f gradle || true
    # Clean pub cache completely if pub get fails, then retry
    - flutter pub get || (rm -rf .pub-cache && flutter pub get)
    # Decode keystore from base64 CI variable to expected location
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
    # Create key.properties for signing
    - |
      cat > android/key.properties << EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=$KEY_ALIAS
      storeFile=key.jks
      EOF
    - flutter build apk --release --verbose
  after_script:
    # Always kill gradle daemons after build
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  needs: 
    - job: "build_debug_apk"
    - job: "build_release_apk"
      optional: true
  script:
    - echo "Publishing release with APKs for pipeline $CI_PIPELINE_ID"
  release:
    name: "Release Pipeline $CI_PIPELINE_ID"
    description: "Automated release for pipeline $CI_PIPELINE_ID from commit $CI_COMMIT_SHORT_SHA"
    tag_name: "pipeline-$CI_PIPELINE_ID"
    assets:
      links:
        - name: "Debug APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/$CI_COMMIT_SHA/raw/build/app/outputs/flutter-apk/app-debug.apk?job=build_debug_apk"
        - name: "Release APK (Signed)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/$CI_COMMIT_SHA/raw/build/app/outputs/flutter-apk/app-release.apk?job=build_release_apk"
