stages:
  - build
  - build-linux
  - release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"

cache:
  key: "$CI_COMMIT_REF_SLUG-v2"
  paths:
    - .pub-cache/
  policy: pull-push

build_debug_apk:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Fully clean build artifacts, caches, and temp directories
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies
    - rm -rf .pub-cache # Completely delete pub-cache to prevent temp file errors
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons
    - pkill -f gradle || true
    # Fetch dependencies safely
    - flutter pub get
    - flutter build apk --debug
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 hour

build_debug_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  needs:
    - job: "build_debug_apk"
      optional: true
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  before_script:
    # Install Linux desktop development dependencies
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get
    - flutter build linux --debug
  artifacts:
    paths:
      - build/linux/x64/debug/bundle/
    expire_in: 1 hour

build_debug_macos:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-macos-desktop
    - flutter clean
    - flutter pub get
    # If the Flutter SDK in this environment doesn't support `flutter build macos`,
    # detect and skip the macOS build to avoid a failing job on non-macOS runners.
    - |
      if ! flutter help build | grep -q "macos"; then
        echo "macOS build not supported in this environment (skipping)."
        exit 0
      fi
    # Prevent system sleep during build
    - caffeinate -i flutter build macos
  artifacts:
    paths:
      - build/macos/Build/Products/Debug/
    expire_in: 1 hour

build_debug_ios:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    - flutter pub get
    # Prevent system sleep during build
    - caffeinate -i flutter build ios --no-codesign
  artifacts:
    paths:
      - build/ios/iphoneos/
    expire_in: 1 hour

publish_release:
  stage: release
  tags:
    - apple # Use the same macOS runner that ran the builds
  needs:
    - job: "build_debug_apk"
    - job: "build_debug_linux"
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  # allow_failure: false # Change to false once permissions are confirmed, but left as true for safety.
  
  before_script:
    # Skip release-cli installation and use GitLab API directly
    - echo "Using GitLab API for release creation (more reliable than release-cli on shell executors)"
    - export USE_RELEASE_CLI=false
  
  script:
    - echo "Creating release for pipeline $CI_PIPELINE_ID with artifacts..."

    # Define release tag 
    - RELEASE_TAG="pipeline-$CI_PIPELINE_ID"
    
    # Get all commits since last successful pipeline for comprehensive release notes
    - |
      echo "Gathering commits since last successful build..."
      
      # Find the last successful pipeline before this one
      LAST_SUCCESS_SHA=""
      PIPELINES_DATA=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?status=success&per_page=50")
      
      # Extract the SHA of the most recent successful pipeline (excluding current)
      LAST_SUCCESS_SHA=$(echo "$PIPELINES_DATA" | grep -o '"sha":"[^"]*"' | grep -v "$CI_COMMIT_SHA" | head -1 | cut -d'"' -f4)
      
      echo "Last successful pipeline SHA: $LAST_SUCCESS_SHA"
      echo "Current SHA: $CI_COMMIT_SHA"
      
      # Generate comprehensive commit list
      if [ -n "$LAST_SUCCESS_SHA" ]; then
        echo "Fetching commits since last successful build..."
        
        # Get commit range from last success to current
        COMMIT_RANGE="$LAST_SUCCESS_SHA..$CI_COMMIT_SHA"
        echo "Commit range: $COMMIT_RANGE"
        
        # Get detailed commit information
        COMMITS_DATA=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits?ref_name=$CI_COMMIT_REF_NAME&since=$(date -d '30 days ago' -Iseconds)&per_page=200")
        
        # Extract commits newer than last success
        COMMIT_LOG=""
        COMMIT_COUNT=0
        
        # Parse commits and build formatted list
        echo "$COMMITS_DATA" | grep -E '"(id|title|author_name|created_at)"' | while IFS= read -r line; do
          if echo "$line" | grep -q '"id"'; then
            COMMIT_ID=$(echo "$line" | cut -d'"' -f4)
          elif echo "$line" | grep -q '"title"'; then
            COMMIT_TITLE=$(echo "$line" | cut -d'"' -f4 | sed 's/"/\\"/g')
          elif echo "$line" | grep -q '"author_name"'; then
            COMMIT_AUTHOR=$(echo "$line" | cut -d'"' -f4)
          elif echo "$line" | grep -q '"created_at"'; then
            COMMIT_DATE=$(echo "$line" | cut -d'"' -f4 | cut -dT -f1)
            
            # Stop when we reach the last successful commit
            if [ "$COMMIT_ID" = "$LAST_SUCCESS_SHA" ]; then
              break
            fi
            
            # Add commit to log
            if [ -n "$COMMIT_ID" ] && [ -n "$COMMIT_TITLE" ]; then
              COMMIT_LOG="$COMMIT_LOG\\n• $COMMIT_TITLE ($COMMIT_AUTHOR - $COMMIT_DATE) [$COMMIT_ID]"
              COMMIT_COUNT=$((COMMIT_COUNT + 1))
            fi
          fi
        done > /tmp/commit_processing.txt
        
        # Read the processed commits
        if [ -f "/tmp/commit_processing.txt" ]; then
          COMMIT_LOG=$(cat /tmp/commit_processing.txt)
        fi
        
        # Build comprehensive release notes
        RELEASE_NOTES="# Release Pipeline $CI_PIPELINE_ID\\n\\n"
        RELEASE_NOTES="${RELEASE_NOTES}**Build Information:**\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Pipeline: $CI_PIPELINE_ID\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Commit: $CI_COMMIT_SHORT_SHA\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Branch: $CI_COMMIT_REF_NAME\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Date: $(date)\\n\\n"
        
        if [ "$COMMIT_COUNT" -gt 0 ]; then
          RELEASE_NOTES="${RELEASE_NOTES}**Changes Since Last Release ($COMMIT_COUNT commits):**\\n$COMMIT_LOG"
        else
          RELEASE_NOTES="${RELEASE_NOTES}**Changes:** First release or no commits found since last successful build"
        fi
        
        echo "Generated release notes with $COMMIT_COUNT commits"
      else
        echo "No previous successful pipeline found, creating basic release notes..."
        RELEASE_NOTES="# Release Pipeline $CI_PIPELINE_ID\\n\\n"
        RELEASE_NOTES="${RELEASE_NOTES}**Build Information:**\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Pipeline: $CI_PIPELINE_ID\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Commit: $CI_COMMIT_SHORT_SHA\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Branch: $CI_COMMIT_REF_NAME\\n"
        RELEASE_NOTES="${RELEASE_NOTES}• Date: $(date)\\n\\n"
        RELEASE_NOTES="${RELEASE_NOTES}**Changes:** Initial release - no previous successful builds found"
      fi
      
      echo "Final release notes preview:"
      echo -e "$RELEASE_NOTES"

    # Create release using GitLab API with proper job IDs and authentication
    - echo "Creating release using GitLab API..."
    - |
      # Get the complete pipeline jobs data and parse it properly
      JOBS_DATA=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs")
      
      echo "Jobs data response:"
      echo "$JOBS_DATA" | head -5
      
      # Extract job IDs more reliably using jq-style parsing
      APK_JOB_ID=$(echo "$JOBS_DATA" | grep -A5 -B5 '"name":"build_debug_apk"' | grep '"id":' | head -1 | sed 's/.*"id":\([0-9]*\).*/\1/')
      LINUX_JOB_ID=$(echo "$JOBS_DATA" | grep -A5 -B5 '"name":"build_debug_linux"' | grep '"id":' | head -1 | sed 's/.*"id":\([0-9]*\).*/\1/')
      
      echo "APK Job ID: $APK_JOB_ID"
      echo "Linux Job ID: $LINUX_JOB_ID"
      
      # Validate we got valid job IDs
      if [ -z "$APK_JOB_ID" ] || [ -z "$LINUX_JOB_ID" ]; then
        echo "Failed to extract job IDs. Using simplified artifact URLs..."
        APK_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/artifacts/main/raw/build/app/outputs/flutter-apk/app-debug.apk?job=build_debug_apk"
        LINUX_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/artifacts/main/download?job=build_debug_linux"
      else
        APK_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$APK_JOB_ID/artifacts/raw/build/app/outputs/flutter-apk/app-debug.apk"
        LINUX_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$LINUX_JOB_ID/artifacts/download"
      fi
      
      echo "APK URL: $APK_URL"
      echo "Linux URL: $LINUX_URL"
      
      # Create the release using JOB-TOKEN instead of PRIVATE-TOKEN
      RESPONSE=$(curl -w "%{http_code}" -s --header "Content-Type: application/json" \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --data '{
             "name": "Release Pipeline '"$CI_PIPELINE_ID"'",
             "tag_name": "'"$RELEASE_TAG"'",
             "description": "'"$RELEASE_NOTES"'",
             "ref": "'"$CI_COMMIT_SHA"'",
             "assets": {
               "links": [
                 {
                   "name": "Android APK",
                   "url": "'"$APK_URL"'",
                   "link_type": "package"
                 },
                 {
                   "name": "Linux Build Archive", 
                   "url": "'"$LINUX_URL"'",
                   "link_type": "package"
                 }
               ]
             }
           }' \
           --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      
      # Check response
      HTTP_CODE=${RESPONSE: -3}
      RESPONSE_BODY=${RESPONSE%???}
      
      echo "HTTP Response Code: $HTTP_CODE"
      echo "Response Body: $RESPONSE_BODY"
      
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✅ Release created successfully!"
      else
        echo "❌ Release creation failed with HTTP $HTTP_CODE"
        echo "Response: $RESPONSE_BODY"
        exit 1
      fi