stages:
  - build
  - build-linux
  - release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"

cache:
  key: "$CI_COMMIT_REF_SLUG-v2"
  paths:
    - .pub-cache/
  policy: pull-push

build_debug_apk:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Fully clean build artifacts, caches, and temp directories
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies
    - rm -rf .pub-cache # Completely delete pub-cache to prevent temp file errors
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons
    - pkill -f gradle || true
    # Fetch dependencies safely
    - flutter pub get
    - flutter build apk --debug
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build_debug_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  needs:
    - job: "build_debug_apk"
      optional: true
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  before_script:
    # Install Linux desktop development dependencies
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get
    - flutter build linux --debug
  artifacts:
    paths:
      - build/linux/x64/debug/bundle/
    expire_in: 1 week

build_debug_macos:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-macos-desktop
    - flutter clean
    - flutter pub get
    # If the Flutter SDK in this environment doesn't support `flutter build macos`,
    # detect and skip the macOS build to avoid a failing job on non-macOS runners.
    - |
      if ! flutter help build | grep -q "macos"; then
        echo "macOS build not supported in this environment (skipping)."
        exit 0
      fi
    # Prevent system sleep during build
    - caffeinate -i flutter build macos
  artifacts:
    paths:
      - build/macos/Build/Products/Debug/
    expire_in: 1 week

build_debug_ios:
  stage: build
  tags:
    - apple
  allow_failure: true
  before_script:
    # Set up Flutter if not in PATH
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        # Common Flutter installation paths on macOS
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    # Clean build artifacts (but preserve build directory for artifacts)
    - rm -rf .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    - flutter pub get
    # Prevent system sleep during build
    - caffeinate -i flutter build ios --no-codesign
  artifacts:
    paths:
      - build/ios/iphoneos/
    expire_in: 1 week

publish_release:
  stage: release
  tags:
    - apple
  needs:
    - job: "build_debug_apk"
    - job: "build_debug_linux"
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true
  allow_failure: true
  before_script:
    # Install GitLab CLI if not available
    - |
      if ! command -v glab &> /dev/null; then
        echo "Installing GitLab CLI..."
        if [[ "$OSTYPE" == "darwin"* ]]; then
          # macOS
          if command -v brew &> /dev/null; then
            brew install glab
          else
            echo "Homebrew not found, downloading glab binary..."
            curl -s https://api.github.com/repos/profclems/glab/releases/latest | grep "browser_download_url.*darwin.*tar.gz" | cut -d '"' -f 4 | head -n 1 | xargs curl -L -o glab.tar.gz
            tar -xzf glab.tar.gz
            sudo mv bin/glab /usr/local/bin/
          fi
        else
          echo "Unsupported OS for glab installation"
          exit 1
        fi
      fi
  script:
    - echo "Publishing debug builds with APKs, Linux builds, and optional macOS/iOS builds for pipeline $CI_PIPELINE_ID"
    - |
      if command -v glab &> /dev/null; then
        echo "Creating release with glab..."
        glab release create "pipeline-$CI_PIPELINE_ID" \
          --name "Release Pipeline $CI_PIPELINE_ID" \
          --notes "Automated release for pipeline $CI_PIPELINE_ID from commit $CI_COMMIT_SHORT_SHA" \
          --repo "$CI_PROJECT_PATH" || echo "Release creation failed but continuing..."
      else
        echo "GitLab CLI not available, skipping release creation"
      fi
