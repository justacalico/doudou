stages:
- build
- release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  script:
    - flutter --version
    - flutter pub get
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  needs: ["build_debug_apk"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing release with debug APK for tag $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for tag $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Debug APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/$CI_COMMIT_REF_NAME/raw/build/app/outputs/flutter-apk/app-debug.apk?job=build_debug_apk"
