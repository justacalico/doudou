variables:
  FLUTTER_CHANNEL: stable
  APPIMAGE_EXTRACT_AND_RUN: "1"
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  PUB_CACHE: "/tmp/pub-cache-$CI_JOB_ID"
  GIT_DEPTH: "10"
  CREATE_RELEASE: "false"
  BUILD_ALL: "false"

# No GitLab cache for pub to avoid long-term issues.
cache: {}

workflow:
  rules:
    - if: $CREATE_RELEASE == "true"
      variables:
        BUILD_ALL: "true"
    - when: always

stages:
  - test
  - info
  - build
  - release

.no-mr:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never

.default-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.full-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $BUILD_ALL == "true"
    - if: $CREATE_RELEASE == "true"

.release-rules-nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CREATE_RELEASE != "true"

.release-rules-version:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CREATE_RELEASE == "true" && $BUILD_ALL == "true"

test:
  stage: test
  tags: [linux-truenas]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - . scripts/ci-setup.sh test
  script:
    - set -euo pipefail; flutter test --coverage --reporter expanded
    - set -euo pipefail; bash scripts/ci-coverage-threshold.sh
  coverage: '/Coverage: (\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    expire_in: 1 week

build-info:
  stage: info
  tags: [saas-linux-small-amd64]
  image: debian:stable-slim
  rules: !reference [.default-build-rules, rules]
  script:
    - |
      set -eu
      VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
      BUILD_NUMBER=$(date +%s | cut -c4-10)
      BUILD_DATE=$(date +%Y-%m-%d)
      {
        echo "VERSION=$VERSION"
        echo "BUILD_NUMBER=$BUILD_NUMBER"
        echo "BUILD_DATE=$BUILD_DATE"
        echo "SHORT_SHA=$CI_COMMIT_SHORT_SHA"
      } > build.env
      cat build.env
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 1 week

.common-build:
  stage: build
  tags: [saas-linux-medium-amd64]
  timeout: 30m
  rules: !reference [.default-build-rules, rules]
  needs:
    - job: test
    - job: build-info
  image: $CI_REGISTRY_IMAGE/builder:latest
  cache:
    - key: gradle
      paths:
        - .gradle/
      policy: pull-push
    - key: cargo
      paths:
        - .cargo/
      policy: pull-push
  before_script:
    - . scripts/ci-setup.sh "$BUILD_TARGET"
  script:
    - bash scripts/ci-build.sh "$BUILD_TARGET"
  after_script:
    - rm -rf android/keystore android/app/keystore android/key.properties android/app/key.properties
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

build-android-phone:
  extends: .common-build
  variables:
    BUILD_TARGET: android-phone
    BUILD_AAB: "false"

build-android-phone-playstore:
  extends: .common-build
  rules: !reference [.full-build-rules, rules]
  variables:
    BUILD_TARGET: android-phone-playstore

build-android-wear:
  extends: .common-build
  rules: !reference [.full-build-rules, rules]
  variables:
    BUILD_TARGET: android-wear

build-android-tv-playstore:
  extends: .common-build
  rules: !reference [.full-build-rules, rules]
  variables:
    BUILD_TARGET: android-tv-playstore

build-android-tv:
  extends: .common-build
  rules: !reference [.full-build-rules, rules]
  variables:
    BUILD_TARGET: android-tv

build-linux-x64:
  extends: .common-build
  needs:
    - job: build-info
    - job: test
  variables:
    BUILD_TARGET: linux-x64

# build-linux-arm64:
#   extends: .common-build
