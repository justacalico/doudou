# GitLab CI/CD Pipeline for Doudou Flutter Android APK Build - OPTIMIZED
variables:
  # Flutter version to use - using latest stable version compatible with Dart SDK ^3.8.0
  FLUTTER_VERSION: "3.24.3"  # Pin to specific version for better caching
  # Android SDK variables
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  ANDROID_HOME: "/opt/android-sdk"
  # Java version
  JAVA_VERSION: "17"
  # Command line tools version that's known to be compatible
  CMDLINE_TOOLS_VERSION: "9477386"
  # Add timeout and retry settings
  CI_DEBUG_TRACE: "false"
  # Debug keystore for consistent signing
  DEBUG_KEYSTORE_PASSWORD: "android"
  DEBUG_KEY_PASSWORD: "android"
  DEBUG_KEY_ALIAS: "androiddebugkey"
  # Optimization variables
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Xmx4g -XX:+UseG1GC"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# Define stages
stages:
  - setup
  - build
  - release

default:
  tags:
    - android
  timeout: 25m

# Enhanced cache configuration
cache:
  key: 
    files:
      - pubspec.yaml
      - android/app/build.gradle
  paths:
    - .pub-cache/
    - .dart-tool/
    - .gradle/
    - android/.gradle/
    - /opt/flutter/
    - /opt/android-sdk/
    - build/
  policy: pull-push

# Use pre-built Docker image with Flutter and Android SDK
.use_flutter_image: &use_flutter_image
  image: ghcr.io/cirruslabs/flutter:3.24.3  # Pre-built image with Flutter and Android SDK

# Minimal setup for pre-built image
.setup_minimal: &setup_minimal
  - |
    export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    export PATH=$JAVA_HOME/bin:$PATH
    export ANDROID_SDK_ROOT=/opt/android-sdk-linux
    export ANDROID_HOME=/opt/android-sdk-linux
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    export GRADLE_USER_HOME=$CI_PROJECT_DIR/.gradle
    # Quick license acceptance
    yes | sdkmanager --licenses > /dev/null 2>&1 || true

# Fallback setup script for custom image (if pre-built fails)
.setup_common: &setup_common
  - |
    # Fast package installation with minimal updates
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y --no-install-recommends curl git unzip xz-utils zip wget openjdk-${JAVA_VERSION}-jdk make
    export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    export PATH=$JAVA_HOME/bin:$PATH
  # Fast Android SDK setup with cached downloads
  - |
    if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
      mkdir -p $ANDROID_SDK_ROOT
      cd $ANDROID_SDK_ROOT
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip -O cmdtools.zip
      unzip -q cmdtools.zip
      mkdir -p cmdline-tools/latest
      mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
      rm -rf cmdline-tools/latest/cmdline-tools cmdtools.zip
    fi
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    yes | sdkmanager --licenses > /dev/null 2>&1 || true
    sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
  # Fast Flutter setup with cached installation
  - |
    if [ ! -d "/opt/flutter" ]; then
      cd /opt
      git clone https://github.com/flutter/flutter.git -b ${FLUTTER_VERSION} --depth 1
    fi
    export PATH="/opt/flutter/bin:$PATH"
    flutter config --android-sdk $ANDROID_SDK_ROOT
    cd $CI_PROJECT_DIR
    export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    export GRADLE_USER_HOME=$CI_PROJECT_DIR/.gradle

# Combined setup and keystore creation job
setup_and_keystore:
  stage: setup
  <<: *use_flutter_image
  tags:
    - android
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    - *setup_minimal
  script:
    - |
      echo "=== Flutter Setup ==="
      flutter --version
      flutter doctor --android-licenses || true
      
      echo "=== Dependencies ==="
      flutter pub get --verbose
      
      echo "=== Keystore Creation ==="
      mkdir -p android/app/
      if [ ! -f "android/app/debug.keystore" ]; then
        keytool -genkeypair \
          -alias $DEBUG_KEY_ALIAS \
          -keypass $DEBUG_KEY_PASSWORD \
          -keystore android/app/debug.keystore \
          -storepass $DEBUG_KEYSTORE_PASSWORD \
          -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,S=Debug,C=US" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000
      fi
      
      echo "=== Pre-compile Dart ==="
      flutter analyze --no-fatal-infos || true
      mkdir -p builds
  artifacts:
    paths:
      - .pub-cache/
      - .gradle/
      - android/app/debug.keystore
      - .dart_tool/
    expire_in: 2 hours

# Optimized build stage
build_android_debug:
  stage: build
  <<: *use_flutter_image
  tags:
    - android
  retry:
    max: 1
    when:
      - runner_system_failure
  dependencies:
    - setup_and_keystore
  variables:
    # Build optimizations
    FLUTTER_BUILD_MODE: "debug"
    GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4 -Xmx6g"
  before_script:
    - *setup_minimal
  script:
    - |
      echo "=== Build Optimization Setup ==="
      export GRADLE_OPTS="$GRADLE_OPTS"
      flutter --version
      
      echo "=== Verify Keystore ==="
      if [ -f "android/app/debug.keystore" ]; then
        echo "✓ Debug keystore found"
        ls -la android/app/debug.keystore
      else
        echo "⚠ Warning: Debug keystore not found"
      fi
      
      echo "=== Quick Dependency Check ==="
      flutter pub get --offline || flutter pub get
      
      echo "=== Optimized Build ==="
      # Use direct flutter build instead of make for better control
      flutter build apk \
        --debug \
        --target-platform android-arm64 \
        --no-tree-shake-icons \
        --dart-define=flutter.inspector.structuredErrors=false \
        || {
        echo "ARM64 build failed, trying universal APK..."
        flutter build apk --debug
      }
      
      echo "=== Package Results ==="
      mkdir -p builds/$CI_PIPELINE_ID
      
      # Find and copy the built APK
      if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
        cp build/app/outputs/flutter-apk/app-debug.apk builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
        echo "✓ APK packaged successfully"
      else
        echo "✗ APK not found, checking alternative locations..."
        find build/ -name "*.apk" -type f -exec cp {} builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk \;
      fi
      
      ls -la builds/$CI_PIPELINE_ID/
      echo "Build completed in $(date)"
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Parallel release jobs for tagged commits
release_to_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  dependencies:
    - build_android_debug
  script:
    - echo "Creating GitLab Release with debug APK for tag $CI_COMMIT_TAG..."
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID - Optimized Build'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
  only:
    - tags

# Optimized pipeline release
release_from_pipeline:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  dependencies:
    - build_android_debug
  variables:
    GIT_STRATEGY: none  # Skip git clone for release job
  before_script:
    - |
      # Quick version extraction without full apt update
      VERSION=$(grep 'version:' pubspec.yaml | sed -e 's/version:[^0-9]*\([0-9.]*\).*/\1/' | head -1)
      echo "App version: $VERSION"
  script:
    - echo "Creating optimized GitLab Release..."
  release:
    name: 'Build v$VERSION-$CI_PIPELINE_ID'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID - Optimized Build (~15min)'
    tag_name: 'build-$CI_PIPELINE_ID'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
  only:
    - main
  except:
    - tags