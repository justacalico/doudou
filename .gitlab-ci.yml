# GitLab CI/CD Pipeline for Doudou Flutter Android APK Build (Optimized)

variables:
  # Use official Flutter Docker image that supports Dart 3.x
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:3.24.3"
  # Android SDK variables
  ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
  ANDROID_HOME: "/opt/android-sdk-linux"  
  CI_DEBUG_TRACE: "false"

stages:
  - dependencies
  - build
  - release

default:
  tags:
    - android
  timeout: 15m  # Reduced from 30m since setup is much faster
  image: $FLUTTER_IMAGE

# Enhanced cache configuration with multiple cache keys
cache:
  - key: "flutter-deps-${CI_COMMIT_REF_SLUG}"
    paths:
      - .pub-cache/
      - .dart-tool/
    policy: pull-push
  - key: "gradle-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - android/.gradle/
      - ~/.gradle/
    policy: pull-push
  - key: "build-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - build/
    policy: pull-push

# Install dependencies only when pubspec files change
install_dependencies:
  stage: dependencies
  cache:
    key: "deps-${CI_COMMIT_REF_SLUG}-$CI_COMMIT_SHORT_SHA"
    paths:
      - .pub-cache/
      - .dart-tool/
      - /opt/android-sdk-linux/
    policy: pull-push
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - export ANDROID_SDK_ROOT=/opt/android-sdk-linux
    - export ANDROID_HOME=/opt/android-sdk-linux
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    # Install Android SDK if not present
    - |
      if [ ! -d "$ANDROID_SDK_ROOT" ]; then
        echo "Installing Android SDK..."
        apt-get update && apt-get install -y wget unzip openjdk-17-jdk
        mkdir -p $ANDROID_SDK_ROOT
        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      fi
    - flutter doctor -v
  script:
    - flutter pub get
    - flutter pub deps
    - echo "Dependencies installed successfully"
  artifacts:
    paths:
      - .pub-cache/
      - .dart-tool/
    expire_in: 2 hours
  only:
    changes:
      - pubspec.yaml
      - pubspec.lock
      - lib/**/*
      - android/**/*

# Fast build job - no setup overhead
build_android_debug:
  stage: build
  dependencies:
    - install_dependencies
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - export ANDROID_SDK_ROOT=/opt/android-sdk-linux
    - export ANDROID_HOME=/opt/android-sdk-linux
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - flutter doctor -v
  script:
    - |
      # Quick pub get (should be fast with cache)
      flutter pub get
      
      # Clean build if needed
      flutter clean
      
      # Build APK directly (no Makefile needed)
      echo "Building debug APK..."
      flutter build apk --debug
      
      # Verify build output
      ls -la build/app/outputs/flutter-apk/
      
      # Create organized output directory
      mkdir -p builds/$CI_PIPELINE_ID
      cp build/app/outputs/flutter-apk/app-debug.apk builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
      
      echo "APK built successfully:"
      ls -la builds/$CI_PIPELINE_ID/
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
    expire_in: 30 days
    reports:
      # Add build size reporting
      junit: build/app/outputs/flutter-apk/app-debug.apk
  only:
    - main
    - develop
    - merge_requests
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /\[skip ci\]/

# Optional: Build release APK for tags (runs in parallel)
build_android_release:
  stage: build
  dependencies:
    - install_dependencies
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - export ANDROID_SDK_ROOT=/opt/android-sdk-linux
    - export ANDROID_HOME=/opt/android-sdk-linux
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - flutter doctor -v
  script:
    - flutter pub get
    - flutter clean
    - echo "Building release APK..."
    - flutter build apk --release
    - mkdir -p builds/$CI_PIPELINE_ID
    - cp build/app/outputs/flutter-apk/app-release.apk builds/$CI_PIPELINE_ID/doudou-release-$CI_PIPELINE_ID.apk
    - echo "Release APK built successfully"
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-release-$CI_PIPELINE_ID.apk
    expire_in: 90 days
  only:
    - tags
  when: manual

# Optional: Build App Bundle for Play Store
build_android_bundle:
  stage: build
  dependencies:
    - install_dependencies
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter doctor -v
    - yes | flutter doctor --android-licenses || echo "Android licenses accepted"
  script:
    - flutter pub get
    - flutter clean
    - echo "Building Android App Bundle..."
    - flutter build appbundle --release
    - mkdir -p builds/$CI_PIPELINE_ID
    - cp build/app/outputs/bundle/release/app-release.aab builds/$CI_PIPELINE_ID/doudou-bundle-$CI_PIPELINE_ID.aab
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-bundle-$CI_PIPELINE_ID.aab
    expire_in: 90 days
  only:
    - tags
  when: manual

# GitLab Release for tagged commits
release_to_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build_android_debug
  script:
    - echo "Creating GitLab Release with debug APK for tag $CI_COMMIT_TAG..."
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Doudou Flutter App - Release $CI_COMMIT_TAG
      
      Pipeline: $CI_PIPELINE_ID
      Commit: $CI_COMMIT_SHORT_SHA
      
      Built with Flutter stable on $(date)
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
        - name: 'doudou-release-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-release-${CI_PIPELINE_ID}.apk?job=build_android_release&inline=false'
          link_type: 'package'
  only:
    - tags

# Create pipeline-based releases for main branch
release_from_pipeline:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build_android_debug
  before_script:
    - "apt-get update -qy && apt-get install -y grep sed"
    - "VERSION=$(grep 'version:' pubspec.yaml | sed -e 's/version:[^0-9]*\\([0-9.]*\\).*/\\1/' | head -1)"
    - "echo \"App version from pubspec.yaml: $VERSION\""
  script:
    - echo "Creating GitLab Release with debug APK (pipeline-based)..."
  release:
    name: 'Build v$VERSION-$CI_PIPELINE_ID'
    description: |
      Doudou Flutter App - Development Build
      
      Version: $VERSION
      Pipeline: $CI_PIPELINE_ID
      Branch: $CI_COMMIT_REF_NAME
      Commit: $CI_COMMIT_SHORT_SHA
      
      Built with Flutter stable on $(date)
    tag_name: 'build-$CI_PIPELINE_ID'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
  only:
    - main
  except:
    - tags

# Cleanup old artifacts (runs weekly)
cleanup_artifacts:
  stage: release
  image: alpine:latest
  script:
    - echo "Cleanup job - artifacts are automatically cleaned based on expire_in settings"
    - echo "Debug APKs expire in 30 days"
    - echo "Release APKs expire in 90 days"
  only:
    - schedules
  when: manual