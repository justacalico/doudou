stages:
  - test
  - build
  - release

variables:
  # Using the default GitLab variable for cache location is generally better
  # PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  # Set a recommended Flutter version
  FLUTTER_VERSION: "3.16.0"
  
# Define a common template for Flutter setup
.flutter_setup: &flutter_setup
  # Use a specific, consistent Docker image with Flutter pre-installed
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android # assuming 'android' tag means a machine with Android SDK/tools
  before_script:
    # 1. Clean up previous build/cache directories safely
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies .pub-cache || true
    - flutter clean
    # 2. Kill any existing Gradle daemons to prevent locking issues
    - pkill -f gradle || true
    # 3. Get dependencies once
    - flutter pub get

test:
  stage: test
  # Use the standard setup template
  <<: *flutter_setup
  script:
    - flutter test
    - flutter analyze
    # Only run the shell script if it exists and is needed for CI
    - |
      if [ -f "test-fdroid-build.sh" ]; then
        chmod +x test-fdroid-build.sh
        ./test-fdroid-build.sh
      else
        echo "test-fdroid-build.sh not found, skipping."
      fi

build_debug_apk:
  stage: build
  <<: *flutter_setup
  script:
    - flutter --version
    - flutter build apk --debug
  after_script:
    # After script should mainly be for cleanup
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build_release_apk:
  stage: build
  <<: *flutter_setup
  script:
    - flutter --version
    # Decode keystore from base64 CI variable to expected location
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
    # Create key.properties for signing
    - |
      cat > android/key.properties << EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=$KEY_ALIAS
      storeFile=key.jks
      EOF
    - flutter build apk --release
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

# Renamed to include 'desktop' for clarity
build_debug_linux_desktop:
  stage: build
  <<: *flutter_setup
  before_script:
    # Standard setup
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies .pub-cache || true
    - flutter clean
    - pkill -f gradle || true
    # Install Linux desktop development dependencies
    - apt-get update -qq
    # Simplified install: these are standard packages for Linux Flutter builds
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
    - flutter config --enable-linux-desktop
    - flutter pub get
  script:
    - flutter --version
    - flutter build linux --debug
  artifacts:
    paths:
      - build/linux/x64/debug/bundle/
    expire_in: 1 week

# Renamed to include 'desktop' for clarity
build_release_linux_desktop:
  stage: build
  <<: *flutter_setup
  before_script:
    # Standard setup
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies .pub-cache || true
    - flutter clean
    - pkill -f gradle || true
    # Install Linux desktop development dependencies
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
    - flutter config --enable-linux-desktop
    - flutter pub get
  script:
    - flutter --version
    - flutter build linux --release
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 1 week

build_debug_web:
  stage: build
  <<: *flutter_setup
  before_script:
    # Standard setup
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies .pub-cache || true
    - flutter clean
    - pkill -f gradle || true
    - flutter config --enable-web
    - flutter pub get
  script:
    - flutter --version
    - flutter build web --debug
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

build_release_web:
  stage: build
  <<: *flutter_setup
  before_script:
    # Standard setup
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies .pub-cache || true
    - flutter clean
    - pkill -f gradle || true
    - flutter config --enable-web
    - flutter pub get
  script:
    - flutter --version
    - flutter build web --release
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android # Changed to a generic tag if possible, but kept as 'android' if required
  needs:
    # Changed to only need the final release artifacts
    - job: "build_release_apk"
    - job: "build_release_linux_desktop"
    - job: "build_release_web"
  script:
    # Extract version from pubspec.yaml
    - |
      export APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
      echo "App version from pubspec.yaml: $APP_VERSION"

    # --- Use the 'release-cli' tool instead of manual cURL for cleaner releases ---

    # 1. Create Git Tag
    - git config user.email "ci@openlyst.gitlab.io"
    - git config user.name "GitLab CI"
    # Check for existing tag and only create if it doesn't exist
    - |
      if ! git rev-parse "v$APP_VERSION" >/dev/null 2>&1; then
        echo "Creating tag v$APP_VERSION"
        git tag -a "v$APP_VERSION" -m "Release version $APP_VERSION"
        git push origin "v$APP_VERSION"
      else
        echo "Tag v$APP_VERSION already exists, skipping tag creation."
      fi

    # 2. Create GitLab Release using the official release-cli
    # Use the $CI_PROJECT_URL variable for a correct artifact download link.
    # Note: The artifact URL must point to a specific job. 'build_release_apk' is used here.
    - release-cli create --name "Release $APP_VERSION" --tag-name "v$APP_VERSION" --description "Automated release for version $APP_VERSION" --assets-link "name=APK Release,url=$CI_PROJECT_URL/-/jobs/artifacts/v$APP_VERSION/download?job=build_release_apk"

  # Removed the unnecessary 'dependencies' keyword, 'needs' covers artifact dependency
  only:
    - main
  when: manual