stages:
- test
- build
- release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"
  FLUTTER_VERSION: "3.16.0"

before_script:
  - apt-get update -qq && apt-get install -y -qq git curl unzip
  - git clone https://github.com/flutter/flutter.git -b stable --depth 1
  - export PATH="$PATH:`pwd`/flutter/bin"
  - flutter doctor -v
  - flutter pub get

test:
  stage: test
  script:
    - flutter test
    - flutter analyze
    - chmod +x test-fdroid-build.sh
    - ./test-fdroid-build.sh

build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Fully clean build artifacts, caches, and temp directories
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies
    - rm -rf .pub-cache       # Completely delete pub-cache to prevent temp file errors
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    # Kill any existing Gradle daemons
    - pkill -f gradle || true
    # Fetch dependencies safely
    - flutter pub get 
    - flutter build apk --debug 
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build_release_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter clean
    - pkill -f gradle || true
    - flutter pub get 
    # Decode keystore from base64 CI variable to expected location
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
    # Create key.properties for signing
    - |
      cat > android/key.properties << EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=$KEY_ALIAS
      storeFile=key.jks
      EOF
    - flutter build apk --release 
  after_script:
    - pkill -f gradle || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

build_debug_linux:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Install Linux desktop development dependencies
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get 
    - flutter build linux --debug 
  artifacts:
    paths:
      - build/linux/x64/debug/bundle/
    expire_in: 1 week

build_release_linux:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Install Linux desktop development dependencies
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get 
    - flutter build linux --release 
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 1 week

build_debug_web:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-web
    - flutter clean
    - flutter pub get 
    - flutter build web --debug 
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

build_release_web:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - android
  before_script:
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .pub-cache
    - flutter clean
  script:
    - flutter --version
    - flutter config --enable-web
    - flutter clean
    - flutter pub get 
    - flutter build web --release 
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  needs: 
    - job: "build_debug_apk"
    - job: "build_release_apk"
    - job: "build_debug_linux"
    - job: "build_release_linux"
    - job: "build_debug_web"
    - job: "build_release_web"
  allow_failure: true
  script:
    # Extract version from pubspec.yaml
    - export APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
    - echo "App version from pubspec.yaml: $APP_VERSION"
    
    # Check if this version tag already exists
    - |
      if git tag -l | grep -q "^v$APP_VERSION$"; then
        echo "Tag v$APP_VERSION already exists, skipping release"
        exit 0
      fi
    
    # Create tag with the version from pubspec
    - git config user.email "ci@openlyst.gitlab.io"
    - git config user.name "GitLab CI"
    - git tag -a "v$APP_VERSION" -m "Release version $APP_VERSION"
    - git push origin "v$APP_VERSION"
    
    # Create GitLab release
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data '{
          "name": "Release '"$APP_VERSION"'",
          "tag_name": "v'"$APP_VERSION"'",
          "description": "Automated release for version '"$APP_VERSION"'",
          "assets": {
            "links": [
              {
                "name": "APK Release",
                "url": "'"$CI_PROJECT_URL"'/-/jobs/artifacts/'"$CI_COMMIT_REF_NAME"'/download?job=build_apk"
              }
            ]
          }
        }' \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  
  dependencies:
    - build_apk
  only:
    - main
  when: manual
