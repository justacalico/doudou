# Only run pipelines on main branch and tags to conserve compute minutes
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: never

stages:
  - build
  - build-linux

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdx
  # Optimize artifact handling
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-v3"
  paths:
    - .pub-cache-$CI_JOB_NAME/
  policy: pull-push

build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "debug"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    - flutter pub get --no-precompile
    # Use a smaller build number based on timestamp to stay under Android's 2.1B limit
    - BUILD_NUMBER=$(date +%s)
    - echo "Using build number:" $BUILD_NUMBER
    # Build debug APK (automatically signed with debug key)
    - flutter build apk --debug --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 30m
  timeout: 25m

build_release_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "release"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk openjdk-17-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    # Setup signing - decode base64 keystore from CI variable
    - |
      if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
        echo "Setting up release signing from CI variables..."
        mkdir -p android/keystore
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload-keystore.jks
        # Create key.properties file
        cat > android/key.properties << EOF
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      storeFile=keystore/upload-keystore.jks
      EOF
        echo "Release signing configured"
      else
        echo "WARNING: No keystore provided, using debug signing"
        echo "To enable release signing, set these CI/CD variables:"
        echo "  - ANDROID_KEYSTORE_BASE64 (base64 encoded .jks file)"
        echo "  - ANDROID_KEYSTORE_PASSWORD"
        echo "  - ANDROID_KEY_PASSWORD"
        echo "  - ANDROID_KEY_ALIAS"
      fi
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    - flutter pub get --no-precompile
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        # Use version from git tag (v8.0.0 -> 8.0.0)
        VERSION=${CI_COMMIT_TAG#v}
        echo "Building from tag: $VERSION"
      else
        # Extract version from pubspec.yaml
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
        echo "Building version from pubspec: $VERSION"
      fi
    # Generate build number from timestamp (last 7 digits to stay under Android's 2.1B limit)
    - BUILD_NUMBER=$(date +%s | cut -c4-10)
    - 'echo "Using version: $VERSION, build number: $BUILD_NUMBER"'
    # Build signed release APK
    - flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 7 days
  timeout: 25m

# Build signed AAB for Google Play Store
build_release_aab:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  # Only run when keystore variables are set
  rules:
    - if: $ANDROID_KEYSTORE_BASE64
      when: always
    - when: never
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "release"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk openjdk-17-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    # Setup signing - decode base64 keystore from CI variable
    - |
      if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
        echo "Setting up release signing from CI variables..."
        mkdir -p android/keystore
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload-keystore.jks
        # Create key.properties file
        cat > android/key.properties << EOF
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      storeFile=keystore/upload-keystore.jks
      EOF
        echo "Release signing configured"
      else
        echo "Keystore not configured - this shouldn't happen with rules"
        exit 1
      fi
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    - flutter pub get --no-precompile
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        # Use version from git tag (v8.0.0 -> 8.0.0)
        VERSION=${CI_COMMIT_TAG#v}
        echo "Building from tag: $VERSION"
      else
        # Extract version from pubspec.yaml
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
        echo "Building version from pubspec: $VERSION"
      fi
    # Generate build number from timestamp (last 7 digits to stay under Android's 2.1B limit)
    - BUILD_NUMBER=$(date +%s | cut -c4-10)
    - 'echo "Using version: $VERSION, build number: $BUILD_NUMBER"'
    # Build signed release AAB for Play Store
    - flutter build appbundle --release --build-name=$VERSION --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 30 days
  timeout: 30m

build_release_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-deps-$CI_COMMIT_REF_SLUG-v2"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies more efficiently
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev zip
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        VERSION=${CI_COMMIT_TAG#v}
      else
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
      fi
      echo "Building Linux version $VERSION"
    - flutter build linux --release --build-name=$VERSION --build-number=$CI_PIPELINE_ID
    # Create zip archive of the bundle
    - cd build/linux/x64/release
    - zip -r $CI_PROJECT_DIR/doudou-$VERSION-linux-x64.zip bundle/
    - cd $CI_PROJECT_DIR
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
      - doudou-*-linux-x64.zip
    expire_in: 30m
  timeout: 15m

build_linux_deb:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-deb-deps-$CI_COMMIT_REF_SLUG-v1"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies for Flutter Linux and DEB packaging
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev dpkg-dev
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies dist/ || true
    # Install fastforge globally using project's pub cache
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - dart pub global activate fastforge
    - export PATH="$PATH:$PUB_CACHE/bin"
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    # Build DEB using fastforge
    - $CI_PROJECT_DIR/.pub-cache/bin/fastforge package --platform linux --targets deb
    # Move the output to a predictable location
    - mkdir -p artifacts
    - find dist -name "*.deb" -exec cp {} artifacts/klit-linux-amd64.deb \;
  artifacts:
    paths:
      - artifacts/klit-linux-amd64.deb
    expire_in: 30m
  timeout: 20m

build_linux_appimage:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-appimage-deps-$CI_COMMIT_REF_SLUG-v1"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies for Flutter Linux and AppImage packaging
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev wget fuse libfuse2
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies dist/ || true
    # Install appimagetool
    - wget -q -O /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
    - chmod +x /usr/local/bin/appimagetool
    # Install fastforge globally using project's pub cache
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - dart pub global activate fastforge
    - export PATH="$PATH:$PUB_CACHE/bin"
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    # Build AppImage using fastforge
    - $CI_PROJECT_DIR/.pub-cache/bin/fastforge package --platform linux --targets appimage
    # Move the output to a predictable location
    - mkdir -p artifacts
    - find dist -name "*.AppImage" -exec cp {} artifacts/klit-linux-x86_64.AppImage \;
  artifacts:
    paths:
      - artifacts/klit-linux-x86_64.AppImage
    expire_in: 30m
  timeout: 25m