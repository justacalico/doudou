stages:
  - build
  - release

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

build_debug_apk:
  stage: build
  image: cirruslabs/flutter:latest
  script:
    - flutter --version
    - flutter pub get
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build_debug_apk"]
  script:
    - echo "Publishing release with debug APK"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for tag $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Debug APK"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/build/app/outputs/flutter-apk/app-debug.apk"
