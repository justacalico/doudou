# Only run pipelines on main branch and tags to conserve compute minutes
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: never

stages:
  - build
  - build-linux

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdx
  # Optimize artifact handling
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-v3"
  paths:
    - .pub-cache-$CI_JOB_NAME/
  policy: pull-push

build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "debug"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    - flutter pub get --no-precompile
    # Use a smaller build number based on timestamp to stay under Android's 2.1B limit
    - BUILD_NUMBER=$(date +%s)
    - echo "Using build number:" $BUILD_NUMBER
    # Build debug APK (automatically signed with debug key)
    - flutter build apk --debug --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 30m
  timeout: 25m

build_release_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "release"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk openjdk-17-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    # Create a debug keystore for development builds
    - |
      if [[ -z "$KEYSTORE_PASSWORD" ]]; then
        echo "No keystore password provided, creating debug keystore..."
        # Create keystore in expected location (android/app/key.jks)
        keytool -genkey -v -keystore android/app/key.jks \
          -alias doudou -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Doudou Debug, OU=Debug, O=OpenLyst, L=Debug, S=Debug, C=US"
        # Set environment variables for build.gradle.kts
        export KEYSTORE_PASSWORD=android
        export KEY_PASSWORD=android
        export KEY_ALIAS=doudou
      else
        echo "Using provided keystore configuration..."
        # Copy provided keystore to expected location
        cp "$KEYSTORE_PATH" android/app/key.jks
        export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
        export KEY_PASSWORD="$KEY_PASSWORD" 
        export KEY_ALIAS="$KEY_ALIAS"
      fi
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    # Set keystore environment variables if not already set
    - |
      if [[ -z "$KEYSTORE_PASSWORD" ]]; then
        export KEYSTORE_PASSWORD=android
        export KEY_PASSWORD=android
        export KEY_ALIAS=doudou
      fi
    - flutter pub get --no-precompile
    # Use a smaller build number based on timestamp to stay under Android's 2.1B limit
    - BUILD_NUMBER=$(date +%s)
    - echo "Using build number:" $BUILD_NUMBER
    - echo "Keystore file exists:" $(ls -la android/app/key.jks 2>/dev/null || echo "NOT FOUND")
    # Build signed release APK
    - flutter build apk --release --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30m
  timeout: 25m

build_release_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-deps-$CI_COMMIT_REF_SLUG-v2"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies more efficiently
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    - flutter build linux --release --build-number=$CI_PIPELINE_ID
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 30m
  timeout: 15m