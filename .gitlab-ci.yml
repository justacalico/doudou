stages:
  - build
  - build-linux
  - release
  - cleanup

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache-$CI_JOB_NAME"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx
  # Increase artifact upload timeout
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-v3"
  paths:
    - .pub-cache-$CI_JOB_NAME/
  policy: pull-push

build_release_apk:
  stage: build
  tags:
    - apple
  allow_failure: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  variables:
    GIT_STRATEGY: none
    JOB_WORK_DIR: "$HOME/tmp/doudou-apk-$CI_JOB_ID"
  cache:
    key: "apk-$CI_COMMIT_REF_SLUG-v3"
    paths:
      - .pub-cache-build_release_apk/
    policy: pull-push
  before_script:
    - rm -rf "$JOB_WORK_DIR" || true
    - mkdir -p "$JOB_WORK_DIR"
    - cd "$JOB_WORK_DIR"
    - git clone --depth 1 --branch $CI_COMMIT_REF_NAME $CI_REPOSITORY_URL .
    - git checkout $CI_COMMIT_SHA
    - pkill -f "gradle.*doudou" || true
    - pkill -f "dart.*doudou" || true  
    - sleep 2
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    - mkdir -p "$PUB_CACHE"
    - rm -rf build/ .dart_tool/ android/.gradle android/.kotlin .flutter-plugins-dependencies || true
    - rm -rf "$PUB_CACHE" || true
    - rm -rf .gradle-*/ || true
    - flutter clean || true
  script:
    - flutter --version
    - flutter clean
    - pkill -f "gradle.*$CI_JOB_ID" || true
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-$CI_JOB_NAME"
    - mkdir -p "$GRADLE_USER_HOME"
    - flutter pub get
    - flutter build apk --release --no-shrink
  after_script:
    - pkill -f "gradle.*$CI_JOB_ID" || true
    - if [ -d "$JOB_WORK_DIR" ]; then cp -r "$JOB_WORK_DIR/build" . 2>/dev/null || true; fi
    - rm -rf "$JOB_WORK_DIR" || true
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 hour

build_release_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  needs:
    - job: "build_release_apk"
      optional: true
    - job: "build_release_macos"
      optional: true
    - job: "build_release_ios"
      optional: true
  before_script:
    - apt-get update
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    - mkdir -p "$PUB_CACHE"
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    - rm -rf "$PUB_CACHE" || true
    - flutter clean || true
  script:
    - flutter --version
    - flutter config --enable-linux-desktop
    - flutter clean
    - flutter pub get
    - flutter build linux --release
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
    expire_in: 1 hour

build_release_macos:
  stage: build
  tags:
    - apple
  allow_failure: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: none
    JOB_WORK_DIR: "$HOME/tmp/doudou-macos-$CI_JOB_ID"
    # Use faster compression and GitLab's fastzip feature
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    FF_USE_FASTZIP: "true"
  cache: {}
  before_script:
    - rm -rf "$JOB_WORK_DIR" || true
    - mkdir -p "$JOB_WORK_DIR"
    - cd "$JOB_WORK_DIR"
    - git clone --depth 1 --branch $CI_COMMIT_REF_NAME $CI_REPOSITORY_URL .
    - git checkout $CI_COMMIT_SHA
    - pkill -f "gradle.*doudou" || true
    - pkill -f "dart.*doudou" || true  
    - sleep 2
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    - mkdir -p "$PUB_CACHE"
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    - rm -rf "$PUB_CACHE" || true
    - rm -rf .gradle-*/ || true
    - flutter clean || true
  script:
    - flutter --version
    - flutter config --enable-macos-desktop
    - flutter clean
    - flutter pub get
    - |
      if ! flutter help build | grep -q "macos"; then
        echo "macOS build not supported in this environment (skipping)."
        exit 0
      fi
    - flutter build macos --release
  after_script:
    # Create a highly compressed archive with only essential files
    - |
      if [ -d "$JOB_WORK_DIR/build/macos/Build/Products/Release/doudou.app" ]; then
        echo "Creating compressed macOS artifact..."
        cd "$JOB_WORK_DIR/build/macos/Build/Products/Release"
        
        # Use maximum compression with gzip (faster than bzip2)
        # Exclude unnecessary files to reduce size
        tar --exclude="*.dSYM" \
            --exclude="*.framework/Versions/*/Headers" \
            --exclude="*.framework/Versions/*/Resources/DWARF" \
            -czf doudou-release-macos.tar.gz doudou.app
        
        FILE_SIZE=$(du -h doudou-release-macos.tar.gz | cut -f1)
        echo "Compressed artifact size: $FILE_SIZE"
        
        mkdir -p "$CI_PROJECT_DIR/build"
        cp doudou-release-macos.tar.gz "$CI_PROJECT_DIR/build/" 2>/dev/null || true
      else
        echo "Build directory not found, skipping artifact creation"
      fi
    - rm -rf "$JOB_WORK_DIR" || true
  artifacts:
    paths:
      - build/doudou-release-macos.tar.gz
    expire_in: 1 hour
    # Don't fail the job if artifact upload fails
    when: on_success

build_release_ios:
  stage: build
  tags:
    - apple
  allow_failure: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: none
    JOB_WORK_DIR: "$HOME/tmp/doudou-ios-$CI_JOB_ID"
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    FF_USE_FASTZIP: "true"
  cache: {}
  before_script:
    - rm -rf "$JOB_WORK_DIR" || true
    - mkdir -p "$JOB_WORK_DIR"
    - cd "$JOB_WORK_DIR"
    - git clone --depth 1 --branch $CI_COMMIT_REF_NAME $CI_REPOSITORY_URL .
    - git checkout $CI_COMMIT_SHA
    - pkill -f "gradle.*doudou" || true
    - pkill -f "dart.*doudou" || true  
    - sleep 2
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Flutter not found in PATH. Attempting to set up Flutter..."
        if [ -d "$HOME/flutter/bin" ]; then
          export PATH="$HOME/flutter/bin:$PATH"
        elif [ -d "/usr/local/flutter/bin" ]; then
          export PATH="/usr/local/flutter/bin:$PATH"
        elif [ -d "/opt/flutter/bin" ]; then
          export PATH="/opt/flutter/bin:$PATH"
        else
          echo "Flutter installation not found. Please install Flutter or update PATH."
          exit 1
        fi
      fi
    - mkdir -p "$PUB_CACHE"
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    - rm -rf "$PUB_CACHE" || true
    - rm -rf .gradle-*/ || true
    - flutter clean || true
  script:
    - flutter --version
    - flutter clean
    - flutter pub get
    - flutter build ios --no-codesign --release
  after_script:
    # Create a compressed archive excluding debug symbols
    - |
      if [ -d "$JOB_WORK_DIR/build/ios/iphoneos" ]; then
        echo "Creating compressed iOS artifact..."
        cd "$JOB_WORK_DIR/build/ios"
        
        # Exclude debug symbols and other large unnecessary files
        tar --exclude="*.dSYM" \
            --exclude="*.framework/Headers" \
            -czf doudou-release-ios.tar.gz iphoneos/
        
        FILE_SIZE=$(du -h doudou-release-ios.tar.gz | cut -f1)
        echo "Compressed artifact size: $FILE_SIZE"
        
        mkdir -p "$CI_PROJECT_DIR/build"
        cp doudou-release-ios.tar.gz "$CI_PROJECT_DIR/build/" 2>/dev/null || true
      else
        echo "Build directory not found, skipping artifact creation"
      fi
    - rm -rf "$JOB_WORK_DIR" || true
  artifacts:
    paths:
      - build/doudou-release-ios.tar.gz
    expire_in: 1 hour
    when: on_success

publish_release:
  stage: release
  tags:
    - apple
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - unknown_failure
  needs:
    - job: "build_release_apk"
    - job: "build_release_linux"
    - job: "build_release_macos"
      optional: true
    - job: "build_release_ios"
      optional: true
  
  before_script:
    - echo "Using GitLab API for release creation (more reliable than release-cli on shell executors)"
    - export USE_RELEASE_CLI=false
    - |
      if ! command -v jq &> /dev/null; then
        echo "Installing jq for JSON parsing..."
        if command -v brew &> /dev/null; then
          brew install jq
        else
          echo "jq not available, will use sed fallback"
        fi
      fi
  
  script:
    - echo "Creating release for pipeline $CI_PIPELINE_ID with artifacts..."
    - RELEASE_TAG="pipeline-$CI_PIPELINE_ID"
    - RELEASE_NOTES="Automated release for pipeline $CI_PIPELINE_ID from commit $CI_COMMIT_SHORT_SHA"
    - |
      echo "Checking if release $RELEASE_TAG already exists..."
      EXISTING_RELEASE=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$RELEASE_TAG")
      
      if echo "$EXISTING_RELEASE" | grep -q '"tag_name"'; then
        echo "Release $RELEASE_TAG already exists, deleting it..."
        curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --request DELETE "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$RELEASE_TAG"
        sleep 2
      fi
    
    - echo "Creating release using GitLab API..."
    - |
      for i in {1..3}; do
        echo "Attempt $i: Fetching pipeline jobs data..."
        JOBS_DATA=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs")
        if [ $? -eq 0 ] && [ -n "$JOBS_DATA" ]; then
          break
        fi
        echo "API call failed, retrying in 5 seconds..."
        sleep 5
      done
      
      echo "Jobs data response:"
      echo "$JOBS_DATA" | head -5
      
      if command -v jq &> /dev/null; then
        APK_JOB_ID=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_apk") | .id')
        LINUX_JOB_ID=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_linux") | .id')
        IOS_JOB_ID=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_ios") | .id')
        MACOS_JOB_ID=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_macos") | .id')
        
        APK_STATUS=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_apk") | .status')
        LINUX_STATUS=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_linux") | .status')
        IOS_STATUS=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_ios") | .status')
        MACOS_STATUS=$(echo "$JOBS_DATA" | jq -r '.[] | select(.name=="build_debug_macos") | .status')
      else
        APK_JOB_ID=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_apk"/,/}$/{ /"id":[0-9]/{s/.*"id":\([0-9]*\).*/\1/p; q} }')
        LINUX_JOB_ID=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_linux"/,/}$/{ /"id":[0-9]/{s/.*"id":\([0-9]*\).*/\1/p; q} }')
        IOS_JOB_ID=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_ios"/,/}$/{ /"id":[0-9]/{s/.*"id":\([0-9]*\).*/\1/p; q} }')
        MACOS_JOB_ID=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_macos"/,/}$/{ /"id":[0-9]/{s/.*"id":\([0-9]*\).*/\1/p; q} }')
        
        APK_STATUS=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_apk"/,/}$/{ /"status":"[^"]*"/{s/.*"status":"\([^"]*\)".*/\1/p; q} }')
        LINUX_STATUS=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_linux"/,/}$/{ /"status":"[^"]*"/{s/.*"status":"\([^"]*\)".*/\1/p; q} }')
        IOS_STATUS=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_ios"/,/}$/{ /"status":"[^"]*"/{s/.*"status":"\([^"]*\)".*/\1/p; q} }')
        MACOS_STATUS=$(echo "$JOBS_DATA" | sed -n '/"name":"build_debug_macos"/,/}$/{ /"status":"[^"]*"/{s/.*"status":"\([^"]*\)".*/\1/p; q} }')
      fi
      
      echo "Job IDs - APK: $APK_JOB_ID, Linux: $LINUX_JOB_ID, iOS: $IOS_JOB_ID, macOS: $MACOS_JOB_ID"
      echo "Job statuses - APK: $APK_STATUS, Linux: $LINUX_STATUS, iOS: $IOS_STATUS, macOS: $MACOS_STATUS"
      
      ASSET_LINKS=""
      
      if [ -n "$APK_JOB_ID" ] && [ "$APK_STATUS" = "success" ]; then
        APK_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$APK_JOB_ID/artifacts/raw/build/app/outputs/flutter-apk/app-debug.apk"
        ASSET_LINKS="$ASSET_LINKS{\"name\": \"Android APK\", \"url\": \"$APK_URL\", \"link_type\": \"package\"},"
      fi
      
      if [ -n "$LINUX_JOB_ID" ] && [ "$LINUX_STATUS" = "success" ]; then
        LINUX_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$LINUX_JOB_ID/artifacts/download"
        ASSET_LINKS="$ASSET_LINKS{\"name\": \"Linux Build Archive\", \"url\": \"$LINUX_URL\", \"link_type\": \"package\"},"
      fi
      
      if [ -n "$IOS_JOB_ID" ] && [ "$IOS_STATUS" = "success" ]; then
        IOS_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$IOS_JOB_ID/artifacts/raw/build/doudou-debug-ios.tar.gz"
        ASSET_LINKS="$ASSET_LINKS{\"name\": \"iOS Debug Build\", \"url\": \"$IOS_URL\", \"link_type\": \"package\"},"
      fi
      
      if [ -n "$MACOS_JOB_ID" ] && [ "$MACOS_STATUS" = "success" ]; then
        MACOS_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$MACOS_JOB_ID/artifacts/raw/build/doudou-debug-macos.tar.gz"
        ASSET_LINKS="$ASSET_LINKS{\"name\": \"macOS Debug Build\", \"url\": \"$MACOS_URL\", \"link_type\": \"package\"},"
      fi
      
      ASSET_LINKS=$(echo "$ASSET_LINKS" | sed 's/,$//')
      
      if [ -z "$ASSET_LINKS" ]; then
        echo "No successful builds with artifacts found. Cannot create release."
        exit 1
      fi
      
      echo "Available artifact links: $ASSET_LINKS"
      
      for i in {1..3}; do
        echo "Attempt $i: Creating release..."
        sleep 2
        RESPONSE=$(curl -w "%{http_code}" -s --header "Content-Type: application/json" \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --data '{
               "name": "Release Pipeline '"$CI_PIPELINE_ID"'",
               "tag_name": "'"$RELEASE_TAG"'",
               "description": "'"$RELEASE_NOTES"'",
               "ref": "'"$CI_COMMIT_SHA"'",
               "assets": {
                 "links": ['"$ASSET_LINKS"']
               }
             }' \
             --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
        
        HTTP_CODE=${RESPONSE: -3}
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          break
        elif [ "$HTTP_CODE" -eq 429 ]; then
          echo "Rate limited, waiting 10 seconds before retry..."
          sleep 10
        else
          echo "Release creation failed with HTTP $HTTP_CODE on attempt $i"
          if [ $i -eq 3 ]; then
            break
          fi
          sleep 5
        fi
      done
      
      HTTP_CODE=${RESPONSE: -3}
      RESPONSE_BODY=${RESPONSE%???}
      
      echo "HTTP Response Code: $HTTP_CODE"
      echo "Response Body: $RESPONSE_BODY"
      
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✅ Release created successfully!"
      else
        echo "❌ Release creation failed with HTTP $HTTP_CODE"
        echo "Response: $RESPONSE_BODY"
        exit 1
      fi

cleanup_apple_runner:
  stage: cleanup
  tags:
    - apple
  when: always
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "🧹 Cleaning up Apple runner build artifacts and caches..."
    - rm -rf $HOME/tmp/doudou-* || true
    - rm -rf .gradle-* || true
    - rm -rf .pub-cache-* || true
    - pkill -f "gradle.*doudou" || true
    - pkill -f "dart.*doudou" || true
    - pkill -f "flutter.*doudou" || true
    - rm -rf build/ || true
    - rm -rf .dart_tool/ || true
    - rm -rf android/.gradle || true
    - rm -rf android/.kotlin || true
    - rm -rf ios/Flutter/ephemeral || true
    - rm -rf macos/Flutter/ephemeral || true
    - rm -rf .flutter-plugins-dependencies || true
    - echo "✅ Apple runner cleanup completed"
  needs:
    - job: "publish_release"
      optional: true
    - job: "build_debug_apk"
      optional: true
    - job: "build_debug_macos"
      optional: true
    - job: "build_debug_ios"
      optional: true

cleanup_linux_runner:
  stage: cleanup
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  when: always
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "🧹 Cleaning up Linux runner build artifacts and caches..."
    - rm -rf build/ || true
    - rm -rf .dart_tool/ || true
    - rm -rf .pub-cache-* || true
    - rm -rf .flutter-plugins-dependencies || true
    - pkill -f "dart.*doudou" || true
    - pkill -f "flutter.*doudou" || true
    - echo "✅ Linux runner cleanup completed"
  needs:
    - job: "build_debug_linux"
      optional: true