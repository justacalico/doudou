# GitLab CI/CD Pipeline for Doudou Flutter Android APK Build - OPTIMIZED
variables:
  # Use pre-built Flutter Docker image for speed
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  # Cache configuration
  PUB_CACHE: ".pub-cache"
  # Debug keystore for consistent signing
  DEBUG_KEYSTORE_PASSWORD: "android"
  DEBUG_KEY_PASSWORD: "android"
  DEBUG_KEY_ALIAS: "androiddebugkey"

# Define stages
stages:
  - setup
  - build
  - release

default:
  tags:
    - android
  timeout: 15m  # Reduced from 30m due to faster builds

# Aggressive caching for speed
cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/
    - .dart_tool/
    - build/
  policy: pull-push

# Create consistent debug keystore (runs in parallel)
create_debug_keystore:
  stage: setup
  image: openjdk:17-slim
  tags:
    - android
  script:
    - |
      mkdir -p android/app/
      # Create a consistent debug keystore
      keytool -genkeypair \
        -alias $DEBUG_KEY_ALIAS \
        -keypass $DEBUG_KEY_PASSWORD \
        -keystore android/app/debug.keystore \
        -storepass $DEBUG_KEYSTORE_PASSWORD \
        -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,S=Debug,C=US" \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000
      
      echo "Debug keystore created successfully"
      ls -la android/app/debug.keystore
  artifacts:
    paths:
      - android/app/debug.keystore
    expire_in: 1 hour

# Setup dependencies (runs in parallel)
setup_flutter:
  stage: setup
  image: $FLUTTER_IMAGE
  tags:
    - android
  variables:
    GIT_STRATEGY: clone  # Ensure clean clone for this job
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - echo "Git repository status check..."
    - pwd && ls -la
    - flutter --version
    - flutter doctor -v
  script:
    - |
      # Try offline first for speed, fallback to online
      flutter pub get --offline || flutter pub get
      
      echo "Flutter setup completed successfully"
      flutter --version
      mkdir -p builds
  artifacts:
    paths:
      - .pub-cache/
      - .dart_tool/
    expire_in: 1 hour

# Build stage - Build Android APK (much faster now)
build_android_debug:
  stage: build
  image: $FLUTTER_IMAGE
  tags:
    - android
  timeout: 20m  # Increase timeout to handle lock cleanup
  retry:
    max: 2  # Fixed: Changed from 3 to 2 (GitLab maximum)
    when:
      - runner_system_failure
      - unknown_failure
      - script_failure  # Add retry for network failures
  dependencies:
    - setup_flutter
    - create_debug_keystore
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    # Use unique Gradle home to avoid lock conflicts
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-$CI_JOB_ID"
    - mkdir -p "$GRADLE_USER_HOME"
    # Install timeout command if not available
    - which timeout || (apt-get update && apt-get install -y coreutils)
    # Fix DNS and network issues
    - echo "8.8.8.8 dl.google.com" >> /etc/hosts
    - echo "8.8.4.4 maven.google.com" >> /etc/hosts
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 8.8.4.4" >> /etc/resolv.conf
    # Kill any existing Gradle processes and clean locks
    - pkill -f gradle || true
    - pkill -f daemon || true
    - rm -rf /tmp/gradle* || true
    - flutter doctor -v
  script:
    - |
      # Function to run Gradle commands with timeout
      run_gradle_with_timeout() {
        local cmd="$1"
        local timeout_duration="300"  # 5 minutes
        
        echo "Running: $cmd (timeout: ${timeout_duration}s)"
        if timeout "$timeout_duration" $cmd; then
          echo "Command completed successfully"
          return 0
        else
          echo "Command timed out or failed"
          return 1
        fi
      }
      
      # Quick dependency check
      flutter pub get --offline || flutter pub get
      
      # Verify debug keystore exists
      if [ -f "android/app/debug.keystore" ]; then
        echo "Debug keystore found, using consistent signing"
        ls -la android/app/debug.keystore
      else
        echo "Warning: Debug keystore not found, APK may not be updatable"
      fi
      
      # Test network connectivity before building
      echo "Testing network connectivity..."
      # Install ping if not available
      which ping || (apt-get update -y && apt-get install -y iputils-ping)
      ping -c 3 dl.google.com || echo "Warning: Cannot reach dl.google.com"
      ping -c 3 maven.google.com || echo "Warning: Cannot reach maven.google.com"
      
      # Configure Gradle for better network handling and prevent locking issues
      mkdir -p "$GRADLE_USER_HOME"
      cat > "$GRADLE_USER_HOME/gradle.properties" << EOF
      org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
      org.gradle.parallel=false
      org.gradle.configureondemand=true
      org.gradle.daemon=false
      org.gradle.caching=false
      org.gradle.vfs.watch=false
      org.gradle.console=plain
      systemProp.http.connectionTimeout=60000
      systemProp.http.socketTimeout=60000
      systemProp.https.connectionTimeout=60000
      systemProp.https.socketTimeout=60000
      systemProp.http.nonProxyHosts=localhost|127.*|[::1]
      EOF
      
      # Add gradle debug information
      echo "Gradle configuration created:"
      cat "$GRADLE_USER_HOME/gradle.properties"
      
      # Clean any existing Gradle locks and caches
      echo "Cleaning Gradle locks and preparing build environment..."
      rm -rf android/.gradle/*/fileHashes/fileHashes.lock
      rm -rf android/.gradle/*/executionHistory/executionHistory.lock
      rm -rf "$GRADLE_USER_HOME/daemon/"*
      
      # Pre-warm Gradle with lock cleanup
      echo "Pre-warming Gradle with clean state..."
      cd android
      
      # Verify Android configuration
      echo "Verifying Android configuration..."
      echo "Android Gradle Plugin version in settings.gradle.kts:"
      grep "com.android.application" settings.gradle.kts || echo "Could not find Android plugin version"
      echo "Kotlin version in settings.gradle.kts:"
      grep "org.jetbrains.kotlin.android" settings.gradle.kts || echo "Could not find Kotlin version"
      
      # Stop any existing daemons and clean locks
      run_gradle_with_timeout "./gradlew --stop" || true
      run_gradle_with_timeout "./gradlew clean --no-daemon --refresh-dependencies --info" || echo "Initial clean failed, continuing..."
      cd ..
      
      # Build APK with network retry logic
      echo "Building Android APK with network resilience..."
      for attempt in 1 2 3; do
        echo "Build attempt $attempt/3"
        if flutter build apk --debug --target-platform android-arm64; then
          echo "Build successful on attempt $attempt"
          break
        else
          echo "Build failed on attempt $attempt"
          if [ $attempt -lt 3 ]; then
            echo "Waiting 30 seconds before retry..."
            sleep 30
            # Clear Gradle locks and caches thoroughly
            echo "Cleaning Gradle state for retry..."
            run_gradle_with_timeout "./gradlew --stop" || true
            rm -rf "$GRADLE_USER_HOME/caches/"
            rm -rf "$GRADLE_USER_HOME/daemon/"
            rm -rf android/.gradle/
            cd android && run_gradle_with_timeout "./gradlew clean --no-daemon" && cd ..
          else
            echo "All build attempts failed"
            exit 1
          fi
        fi
      done
      
      # Copy APK to expected location
      echo "Build completed, organizing output..."
      mkdir -p builds/$CI_PIPELINE_ID
      cp build/app/outputs/flutter-apk/app-debug.apk builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
      
      echo "APK created successfully:"
      ls -la builds/$CI_PIPELINE_ID/
      
      # Verify APK is valid
      file builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
      
      # Clean up Gradle resources
      echo "Cleaning up Gradle resources..."
      cd android && ./gradlew --stop || true && cd ..
      rm -rf "$GRADLE_USER_HOME" || true
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Optional: Build release APK for production
build_android_release:
  stage: build
  image: $FLUTTER_IMAGE
  tags:
    - android
  dependencies:
    - setup_flutter
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
  script:
    - |
      flutter pub get --offline || flutter pub get
      
      echo "Building Android Release APK..."
      flutter build apk --release --target-platform android-arm64
      
      mkdir -p builds/$CI_PIPELINE_ID
      cp build/app/outputs/flutter-apk/app-release.apk builds/$CI_PIPELINE_ID/doudou-release-$CI_PIPELINE_ID.apk
      
      echo "Release APK created successfully:"
      ls -la builds/$CI_PIPELINE_ID/
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-release-$CI_PIPELINE_ID.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: manual

# Release stage - Create GitLab Release with debug APK (for tagged commits)
release_to_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  dependencies:
    - build_android_debug
  script:
    - |
      echo "Creating GitLab Release with debug APK for tag $CI_COMMIT_TAG..."
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
  rules:
    - if: $CI_COMMIT_TAG

# Create a release for non-tagged pipelines (e.g., main branch)
release_from_pipeline:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - android
  dependencies:
    - build_android_debug
  before_script:
    - |
      # Extract version from pubspec.yaml to use in release name
      apk add --no-cache grep sed
      VERSION=$(grep 'version:' pubspec.yaml | sed -e 's/version:[^0-9]*\([0-9.]*\).*/\1/')
      echo "App version from pubspec.yaml: $VERSION"
  script:
    - echo "Creating GitLab Release with debug APK (pipeline-based)..."
  release:
    name: 'Build v$VERSION-$CI_PIPELINE_ID'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID'
    tag_name: 'build-$CI_PIPELINE_ID'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Optional: Quick lint check for MRs
quick_check:
  stage: setup
  image: $FLUTTER_IMAGE
  tags:
    - android
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
  script:
    - flutter pub get --offline || flutter pub get
    - dart format --set-exit-if-changed lib/
    - flutter analyze --fatal-warnings lib/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "lib/**/*.dart"
        - "pubspec.yaml"