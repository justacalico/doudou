# GitLab CI/CD Pipeline for Flutter Android APK Build

variables:
  # Flutter version to use
  FLUTTER_VERSION: "3.24.0"
  # Android SDK variables
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  ANDROID_HOME: "/opt/android-sdk"
  # Java version
  JAVA_VERSION: "17"

# Define stages
stages:
  - setup
  - build
  - deploy

# Cache configuration
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
  policy: pull-push

# Setup stage - Install Flutter and dependencies
setup_flutter:
  stage: setup
  image: ubuntu:22.04
  before_script:
    - apt-get update -qy
    - apt-get install -y curl git unzip xz-utils zip libglu1-mesa wget openjdk-${JAVA_VERSION}-jdk pkg-config
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Install Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    # Accept Android SDK licenses non-interactively
    - mkdir -p $ANDROID_SDK_ROOT/licenses
    - echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo y | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --licenses --verbose || echo "License acceptance completed"
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    # Install Flutter
    - cd /opt
    - git clone https://github.com/flutter/flutter.git -b stable --depth 1
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter doctor -v
    - flutter --version
  script:
    - cd $CI_PROJECT_DIR
    - export PATH="/opt/flutter/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter pub get
    - flutter doctor -v
  artifacts:
    paths:
      - .pub-cache/
    expire_in: 1 hour

# Build stage - Build Android APK using Makefile
build_android_debug:
  stage: build
  image: ubuntu:22.04
  dependencies:
    - setup_flutter
  before_script:
    - apt-get update -qy
    - apt-get install -y curl git unzip xz-utils zip libglu1-mesa wget openjdk-${JAVA_VERSION}-jdk make pkg-config
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Install Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    # Accept Android SDK licenses non-interactively
    - mkdir -p $ANDROID_SDK_ROOT/licenses
    - echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - echo y | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --licenses --verbose || echo "License acceptance completed"
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    # Install Flutter
    - cd /opt
    - git clone https://github.com/flutter/flutter.git -b stable --depth 1
    - export PATH="/opt/flutter/bin:$PATH"
  script:
    - cd $CI_PROJECT_DIR
    - export PATH="/opt/flutter/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter pub get
    - echo "Running make android..."
    - make android
    - echo "Build completed, checking output..."
    - ls -la builds/
    - mkdir -p builds/$CI_PIPELINE_ID
    - cp builds/*/doudou-flutter-*-android-debug.apk builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Build unsigned release APK using Makefile
build_android_release:
  stage: build
  image: ubuntu:22.04
  dependencies:
    - setup_flutter
  before_script:
    - apt-get update -qy
    - apt-get install -y curl git unzip xz-utils zip libglu1-mesa wget openjdk-${JAVA_VERSION}-jdk make pkg-config
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Install Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    - echo y | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --licenses --verbose || echo "License acceptance completed"
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    # Install Flutter
    - cd /opt
    - git clone https://github.com/flutter/flutter.git -b stable --depth 1
    - export PATH="/opt/flutter/bin:$PATH"
  script:
    - cd $CI_PROJECT_DIR
    - export PATH="/opt/flutter/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter pub get
    - echo "Running make android-release..."
    - make android-release
    - echo "Build completed, checking output..."
    - ls -la builds/
    - mkdir -p builds/$CI_PIPELINE_ID
    - cp builds/*/doudou-flutter-*-android-release-unsigned.apk builds/$CI_PIPELINE_ID/doudou-release-unsigned-$CI_PIPELINE_ID.apk
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-release-unsigned-$CI_PIPELINE_ID.apk
    expire_in: 90 days
  only:
    - main
    - tags

# Deploy stage - Upload to releases (optional)
deploy_release:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_android_release
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Release APK built successfully"
    - ls -la builds/$CI_PIPELINE_ID/
    # Add your deployment logic here (e.g., upload to GitLab releases, Play Store, etc.)
  only:
    - tags
  when: manual
