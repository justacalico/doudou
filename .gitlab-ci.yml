spec:
  inputs:
    build_all:
      type: boolean
      default: false
      description: 'Build all Android variants (tv, playstore) in addition to phone and linux'
    create_release:
      type: boolean
      default: false
      description: 'Create a versioned release (requires build_all)'

---

stages:
  - sync
  - release
  - test
  - deploy

github-sync:
  stage: sync
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:justacalico/doudou.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push -f github "$CI_COMMIT_TAG"
      else
        git push github HEAD:main
      fi

github-dispatch:
  stage: sync
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - |
      BUILD_ALL="$[[ inputs.build_all ]]"
      CREATE_RELEASE="$[[ inputs.create_release ]]"
      if [ "$CREATE_RELEASE" = "true" ]; then
        BUILD_ALL="true"
      fi
      bash scripts/trigger-github-build.sh main "$BUILD_ALL" "$CREATE_RELEASE"

github-mr-build:
  stage: sync
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false HEAD

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GH_TOKEN: $GH_TOKEN
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
    - |
      if [ -n "${GITLAB_RELEASE_SSH_KEY:-}" ]; then
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
        echo "" >> ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
      fi
  script:
    - bash scripts/sync-from-github.sh

landing-test:
  stage: test
  tags: [linux-truenas]
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd landing
    - flutter pub get
    - flutter test

pages:
  stage: deploy
  tags: [linux-truenas]
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd landing
    - flutter pub get
    - flutter test
    - |
      # Pages serves at root when the project uses a unique domain,
      # otherwise under /<project>/. Derive the base href from CI_PAGES_URL.
      HOST_AND_PATH="${CI_PAGES_URL#*://}"
      PAGES_PATH="${HOST_AND_PATH#*/}"
      if [ "$PAGES_PATH" = "$HOST_AND_PATH" ]; then
        PAGES_PATH=""
      fi
      PAGES_PATH="${PAGES_PATH%/}"
      if [ -n "$PAGES_PATH" ]; then
        BASE_HREF="/${PAGES_PATH}/"
      elif [ -n "$CI_PAGES_URL" ]; then
        BASE_HREF="/"
      else
        BASE_HREF="/${CI_PROJECT_NAME}/"
      fi
      flutter build web --release --base-href "$BASE_HREF"
    - mv build/web ../public
  artifacts:
    paths:
      - public
  environment:
    name: gitlab-pages
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME
