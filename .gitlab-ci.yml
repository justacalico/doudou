#   variables:
#     BUILD_TARGET: macos

# build-ios:
#   extends: .common-build
#   tags: [macos]
#   variables:
#     BUILD_TARGET: ios

.release-common:
  stage: release
  tags: [linux-truenas]
  timeout: 2h
  needs:
    - job: build-info
    - job: build-android-phone
    - job: build-linux-x64
    - job: build-android-phone-playstore
      optional: true
    - job: build-android-wear
      optional: true
    - job: build-android-tv-playstore
      optional: true
    - job: build-android-tv
      optional: true
  before_script:
    - rm -rf release-assets SHA256SUMS.txt
  script:
    - bash scripts/ci-release.sh "$RELEASE_TYPE"

release-nightly:
  extends: .release-common
  rules: !reference [.release-rules-nightly, rules]
  variables:
    RELEASE_TYPE: nightly

release-version:
  extends: .release-common
  rules: !reference [.release-rules-version, rules]
  variables:
    RELEASE_TYPE: version
