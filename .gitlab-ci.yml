# GitLab CI/CD Pipeline for Doudou Flutter Android APK Build

variables:
  # Flutter version to use - specifying exact version that's compatible with Dart SDK ^3.8.0
  FLUTTER_VERSION: "3.35.2"
  # Android SDK variables
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  ANDROID_HOME: "/opt/android-sdk"
  # Java version
  JAVA_VERSION: "17"
  # Command line tools version that's known to be compatible
  CMDLINE_TOOLS_VERSION: "9477386"

# Define stages
stages:
  - setup
  - build
  - release

default:
tags:
    - android

# Cache configuration
cache:
  key: "${CI_COMMIT_REF_SLUG}-flutter-${FLUTTER_VERSION}"
  paths:
    - .pub-cache/
    - .dart-tool/
    - build/
  policy: pull-push

# Common setup script for Android SDK and Flutter
.setup_common: &setup_common
  - apt-get update -qy
  - apt-get install -y curl git unzip xz-utils zip libglu1-mesa wget openjdk-${JAVA_VERSION}-jdk make pkg-config
  - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
  - export PATH=$JAVA_HOME/bin:$PATH
  # Install Android SDK
  - mkdir -p $ANDROID_SDK_ROOT
  - cd $ANDROID_SDK_ROOT
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip
  - unzip -q commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip
  - mkdir -p cmdline-tools/latest
  - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
  - rm -rf cmdline-tools/latest/cmdline-tools || true
  - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
  # Accept licenses (critical for CI/CD)
  - yes | sdkmanager --licenses > /dev/null || true
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager --update
  - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
  # Install Flutter
  - cd /opt
  - git clone https://github.com/flutter/flutter.git -b ${FLUTTER_VERSION} --depth 1
  - export PATH="/opt/flutter/bin:$PATH"
  - flutter config --android-sdk $ANDROID_SDK_ROOT
  - flutter doctor -v
  # Return to project directory
  - cd $CI_PROJECT_DIR
  - export PATH="/opt/flutter/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
  - export JAVA_HOME=/usr/lib/jvm/java-${JAVA_VERSION}-openjdk-amd64
  - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache

# Setup stage - Install Flutter and dependencies
setup_flutter:
  stage: setup
  image: ubuntu:22.04
tags:
    - android

  before_script:
    - *setup_common
  script:
    - |
      flutter pub get
      flutter clean
      flutter doctor -v
      # Verify the environment is correctly set up
      ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/
      echo "SDK Manager available: $(which sdkmanager)"
      echo "Flutter version: $(flutter --version)"
      mkdir -p builds
  artifacts:
    paths:
      - .pub-cache/
      - $ANDROID_SDK_ROOT/licenses/
    expire_in: 1 hour

# Build stage - Build Android APK using Makefile
build_android_debug:
  stage: build
  image: ubuntu:22.04
tags:
    - android

  dependencies:
    - setup_flutter
  before_script:
    - *setup_common
  script:
    - |
      flutter pub get
      echo "Environment: ANDROID_SDK_ROOT is $ANDROID_SDK_ROOT"
      flutter doctor -v
      echo "Running make android with explicit SDK paths..."
      make ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_SDK_ROOT android
      echo "Build completed, checking output..."
      ls -la builds/
      mkdir -p builds/$CI_PIPELINE_ID
      find builds/ -name "*.apk" -type f -exec cp {} builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk \;
      ls -la builds/$CI_PIPELINE_ID/
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-debug-$CI_PIPELINE_ID.apk
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Build stage - Build Release APK using Makefile
build_android_release:
  stage: build
  image: ubuntu:22.04
tags:
    - android

  dependencies:
    - setup_flutter
  before_script:
    - *setup_common
  script:
    - |
      flutter pub get
      echo "Environment: ANDROID_SDK_ROOT is $ANDROID_SDK_ROOT"
      flutter doctor -v
      echo "Running make android-release with explicit SDK paths..."
      make ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_SDK_ROOT android-release
      echo "Build completed, checking output..."
      ls -la builds/
      mkdir -p builds/$CI_PIPELINE_ID
      find builds/ -name "*-release-unsigned.apk" -type f -exec cp {} builds/$CI_PIPELINE_ID/doudou-release-unsigned-$CI_PIPELINE_ID.apk \;
      ls -la builds/$CI_PIPELINE_ID/
  artifacts:
    paths:
      - builds/$CI_PIPELINE_ID/doudou-release-unsigned-$CI_PIPELINE_ID.apk
    expire_in: 90 days
  only:
    - tags
    - main

# Release stage - Create GitLab Release with debug APK (for tagged commits)
release_to_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
tags:
    - android

  dependencies:
    - build_android_debug
    - build_android_release
  script:
    - |
      echo "Creating GitLab Release with debug and release APKs for tag $CI_COMMIT_TAG..."
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
        - name: 'doudou-release-unsigned-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/builds/${CI_PIPELINE_ID}/doudou-release-unsigned-${CI_PIPELINE_ID}.apk?job=build_android_release&inline=false'
          link_type: 'package'
  only:
    - tags

# Create a release for non-tagged pipelines (e.g., main branch)
release_from_pipeline:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
tags:
    - android
  dependencies:
    - build_android_debug
    - build_android_release
  before_script:
    - |
      # Extract version from pubspec.yaml to use in release name
      apt-get update -qy && apt-get install -y grep sed
      VERSION=$(grep 'version:' pubspec.yaml | sed -e 's/version:[^0-9]*\([0-9.]*\).*/\1/')
      echo "App version from pubspec.yaml: $VERSION"
  script:
    - echo "Creating GitLab Release with debug and release APKs (pipeline-based)..."
  release:
    name: 'Build v$VERSION-$CI_PIPELINE_ID'
    description: 'Doudou Flutter App - Pipeline $CI_PIPELINE_ID'
    tag_name: 'build-$CI_PIPELINE_ID'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'doudou-debug-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/builds/${CI_PIPELINE_ID}/doudou-debug-${CI_PIPELINE_ID}.apk?job=build_android_debug&inline=false'
          link_type: 'package'
        - name: 'doudou-release-unsigned-$CI_PIPELINE_ID.apk'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/builds/${CI_PIPELINE_ID}/doudou-release-unsigned-${CI_PIPELINE_ID}.apk?job=build_android_release&inline=false'
          link_type: 'package'
  only:
    - main
  except:
    - tags
