# Optimized CI/CD pipeline for Linux-only builds
workflow:
  rules:
    # Run on main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run on development branch
    - if: $CI_COMMIT_BRANCH == "development"
    # Run on tags
    - if: $CI_COMMIT_TAG
    # Skip merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: never

stages:
  - build
  - cleanup

variables:
  ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
  ANDROID_HOME: "/opt/android-sdk-linux"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdx
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}-v1"
  paths:
    - .pub-cache/
    - .gradle/
  policy: pull-push

# ===========================
# Android Debug Build
# ===========================
build_debug_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - echo "🚀 Starting Android debug build..."
    # Install required dependencies
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
    
    - cd $CI_PROJECT_DIR
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
  script:
    - flutter pub get
    - export BUILD_NUMBER=$(date +%s)
    - echo "Building with build number: $BUILD_NUMBER"
    - flutter build apk --debug --build-number=$BUILD_NUMBER
    - ls -lh build/app/outputs/flutter-apk/
  artifacts:
    name: "android-debug-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 7 days
  timeout: 20m

# ===========================
# Android Release Build
# ===========================
build_release_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - echo "🚀 Starting Android release build..."
    # Install required dependencies
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk openjdk-17-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
    
    - cd $CI_PROJECT_DIR
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    
    # Setup keystore
    - |
      if [[ -z "$KEYSTORE_PASSWORD" ]]; then
        echo "Creating debug keystore for development..."
        mkdir -p android/app
        keytool -genkey -v -keystore android/app/key.jks \
          -alias doudou -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Doudou Debug, OU=Development, O=Doudou, L=Dev, S=Dev, C=US"
        export KEYSTORE_PASSWORD=android
        export KEY_PASSWORD=android
        export KEY_ALIAS=doudou
      else
        echo "Using production keystore..."
        echo "$KEYSTORE_FILE" | base64 -d > android/app/key.jks
        export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
        export KEY_PASSWORD="$KEY_PASSWORD"
        export KEY_ALIAS="$KEY_ALIAS"
      fi
  script:
    - flutter pub get
    - export BUILD_NUMBER=$(date +%s)
    - echo "Building with build number: $BUILD_NUMBER"
    - flutter build apk --release --build-number=$BUILD_NUMBER
    - ls -lh build/app/outputs/flutter-apk/
  artifacts:
    name: "android-release-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
  timeout: 20m

# ===========================
# Linux Desktop Build
# ===========================
build_release_linux:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - echo "🚀 Starting Linux desktop build..."
    # Install Linux desktop dependencies
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    
    - flutter --version
    - flutter config --enable-linux-desktop
    
    # Clean build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
  script:
    - flutter pub get
    - export BUILD_NUMBER=$(date +%s)
    - echo "Building with build number: $BUILD_NUMBER"
    - flutter build linux --release --build-number=$BUILD_NUMBER
    - cd build/linux/x64/release
    - tar -czf $CI_PROJECT_DIR/doudou-linux-x64.tar.gz bundle/
    - cd $CI_PROJECT_DIR
    - ls -lh doudou-linux-x64.tar.gz
  artifacts:
    name: "linux-release-${CI_COMMIT_SHORT_SHA}"
    paths:
      - doudou-linux-x64.tar.gz
    expire_in: 30 days
  timeout: 15m

# ===========================
# Cleanup Job
# ===========================
cleanup_artifacts:
  stage: cleanup
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  when: always
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "🧹 Cleaning up build artifacts and caches..."
    
    # Kill any hanging processes
    - pkill -9 -f "gradle.*doudou" || true
    - pkill -9 -f "dart.*doudou" || true
    - pkill -9 -f "flutter.*doudou" || true
    - sleep 2
    
    # Remove build artifacts
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies
    - rm -rf .gradle/ .pub-cache/
    - rm -rf android/.gradle android/.kotlin
    
    # Clean up Android SDK
    - rm -rf $ANDROID_SDK_ROOT || true
    
    # Clean up temp files
    - rm -rf /tmp/flutter_* /tmp/gradle* || true
    
    # Show disk usage
    - df -h
    - echo "✅ Cleanup completed"
  timeout: 5m
  needs:
    - job: build_debug_apk
      optional: true
    - job: build_release_apk
      optional: true
    - job: build_release_linux
      optional: true