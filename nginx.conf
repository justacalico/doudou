server {
    listen 34273;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Handle Flutter web routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add headers for Flutter web - relaxed CORS for media servers
        add_header 'Cross-Origin-Embedder-Policy' 'credentialless';
        add_header 'Cross-Origin-Opener-Policy' 'same-origin-allow-popups';
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Proxy for media server requests to bypass CORS
    location /media-proxy/ {
        # Remove the /media-proxy/ prefix and proxy to the target
        rewrite ^/media-proxy/(.*)$ /$1 break;
        
        # This will be dynamically set by the Flutter app
        # For now, we'll handle it in the app itself
        return 404;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}