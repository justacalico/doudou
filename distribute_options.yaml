# FastForge Distribution Configuration
output: dist/

releases:
  - name: production
    jobs:
      # Build AppImage for Linux
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            release: true
      
      # Build DEB for Linux
      - name: linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            release: true
      
      # Build RPM for Linux
      - name: linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            release: true
      
      # Build HAP for OpenHarmony
      - name: ohos-hap
        package:
          platform: ohos
          target: hap
          build_args:
            release: true
