import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveStoreFilePath = {
    if (!keystorePropertiesFile.exists()) {
        return null
    }

    def configuredStoreFile = keystoreProperties['storeFile']
    if (!configuredStoreFile) {
        return null
    }

    def configuredStoreFilePath = configuredStoreFile.toString()
    def candidatePaths = [
        project.file(configuredStoreFilePath),                 // android/app relative
        rootProject.file(configuredStoreFilePath),             // android relative
        rootProject.file("app/${configuredStoreFilePath}")     // compatibility path
    ]

    def existingPath = candidatePaths.find { it.exists() }
    if (existingPath != null) {
        return existingPath
    }

    throw new GradleException("Keystore file not found for storeFile=${configuredStoreFilePath}. Checked: ${candidatePaths*.path.join(', ')}")
}

def resolvedStoreFilePath = resolveStoreFilePath()

android {
    compileSdkVersion flutter.compileSdkVersion
    //ndkVersion flutter.ndkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        phone.java.srcDirs += 'src/phone/kotlin'
        wear.java.srcDirs += 'src/wear/kotlin'
        tv.java.srcDirs += 'src/tv/kotlin'
        if (project.hasProperty('playstore') && project.property('playstore') == 'true') {
            phone.res.srcDirs += 'src/phone/res-playstore'
            phone.manifest.srcFile 'src/phone/AndroidManifest-playstore.xml'
        } else {
            phone.java.srcDirs += 'src/phone/kotlin-wearable'
        }
    }

    flavorDimensions "app"

    productFlavors {
        phone {
            dimension "app"
            applicationId "gitlab.openlyst.doudou"
            minSdkVersion flutter.minSdkVersion
            targetSdkVersion flutter.targetSdkVersion
            // Phone versionCode starts at 1, wear starts at 10000
            // This ensures Play Store picks the right APK per device
            versionCode flutterVersionCode.toInteger()
            versionName flutterVersionName
        }
        wear {
            dimension "app"
            applicationId "gitlab.openlyst.doudou"
            // Wear OS 3+ is API 30
            minSdkVersion 30
            targetSdkVersion flutter.targetSdkVersion
            // Offset by 10000 so Play Store can distinguish wear APKs from phone APKs
            versionCode flutterVersionCode.toInteger() + 10000
            versionName flutterVersionName
        }
        tv {
            dimension "app"
            applicationId "gitlab.openlyst.doudou"
            minSdkVersion flutter.minSdkVersion
            targetSdkVersion flutter.targetSdkVersion
            // Offset by 20000 so Play Store can distinguish TV APKs from phone/wear
            versionCode flutterVersionCode.toInteger() + 20000
            versionName flutterVersionName
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "gitlab.openlyst.doudou"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile resolvedStoreFilePath
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Use release signing when key.properties is available (CI or local).
            // Fall back to debug signing so local release builds still work without keystore setup.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'gitlab.openlyst.doudou'
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:2.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.0-beta02'
    if (!project.hasProperty('playstore') || project.property('playstore') != 'true') {
        phoneImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    }
}
