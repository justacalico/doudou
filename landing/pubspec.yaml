name: doudou_landing
description: "Landing page for Doudou, the music player that streams from your own server."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^7.0.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/screens/
