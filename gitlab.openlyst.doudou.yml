app-id: com.example.myapp
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: myapp

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network  # if your app needs internet

modules:
  - name: myapp
    buildsystem: simple
    build-commands:
      - install -Dm755 myapp /app/bin/myapp
      - install -Dm644 com.example.myapp.desktop /app/share/applications/com.example.myapp.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.example.myapp.png
    sources:
      - type: dir
        path: build/linux/x64/release/bundle