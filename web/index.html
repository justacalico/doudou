<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="doudou">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>doudou</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Hidden audio element for web playback -->
  <audio id="doudou-audio" preload="metadata" style="display: none;"></audio>
  
  <script>
    // Web audio player JavaScript functions
    const audioElement = document.getElementById('doudou-audio');
    
    // Global functions for Flutter to call
    window.doudouAudio = {
      setUrl: function(url) {
        console.log('Setting audio URL:', url);
        audioElement.src = url;
        audioElement.load();
      },
      
      play: function() {
        console.log('Playing audio');
        return audioElement.play().catch(function(error) {
          console.error('Error playing audio:', error);
        });
      },
      
      pause: function() {
        console.log('Pausing audio');
        audioElement.pause();
      },
      
      stop: function() {
        console.log('Stopping audio');
        audioElement.pause();
        audioElement.currentTime = 0;
      },
      
      seek: function(seconds) {
        console.log('Seeking to:', seconds);
        audioElement.currentTime = seconds;
      },
      
      setVolume: function(volume) {
        console.log('Setting volume to:', volume);
        audioElement.volume = Math.max(0, Math.min(1, volume));
      },
      
      getCurrentTime: function() {
        return audioElement.currentTime;
      },
      
      getDuration: function() {
        return audioElement.duration || 0;
      },
      
      isPlaying: function() {
        return !audioElement.paused && !audioElement.ended;
      }
    };
    
    // Event listeners to notify Flutter
    audioElement.addEventListener('loadedmetadata', function() {
      console.log('Audio metadata loaded, duration:', audioElement.duration);
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onLoadedMetadata) {
        window.doudouAudioCallbacks.onLoadedMetadata();
      }
    });
    
    audioElement.addEventListener('play', function() {
      console.log('Audio started playing');
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onPlay) {
        window.doudouAudioCallbacks.onPlay();
      }
    });
    
    audioElement.addEventListener('pause', function() {
      console.log('Audio paused');
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onPause) {
        window.doudouAudioCallbacks.onPause();
      }
    });
    
    audioElement.addEventListener('ended', function() {
      console.log('Audio ended');
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onEnded) {
        window.doudouAudioCallbacks.onEnded();
      }
    });
    
    audioElement.addEventListener('error', function(e) {
      console.error('Audio error:', e);
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onError) {
        window.doudouAudioCallbacks.onError(e);
      }
    });
    
    audioElement.addEventListener('timeupdate', function() {
      if (window.doudouAudioCallbacks && window.doudouAudioCallbacks.onTimeUpdate) {
        window.doudouAudioCallbacks.onTimeUpdate();
      }
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
