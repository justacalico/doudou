name: doudou
description: "A Jellyfin music player app"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  dio: ^5.4.0
  
  # Audio playback
  just_audio: ^0.9.35
  audio_service: ^0.18.12
  
  # State management
  provider: ^6.1.1
  
  # UI components
  cached_network_image: ^3.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
