name: doudou
description: "Stream your music with ease and style."
publish_to: 'none'
version: 7.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  dio: ^5.4.0
  http: ^1.1.0
  
  # Audio playbook
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.1.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  
  # State management
  provider: ^6.1.5
  
  # RxDart for streams
  rxdart: ^0.28.0
  
  # UI components
  cached_network_image: ^3.4.1
  
  # Storage and Caching
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_cache_manager: ^3.4.1
  
  # App info
  package_info_plus: ^8.0.2
  
  # Icons
  cupertino_icons: ^1.0.8
  logging: ^1.3.0
  
  # Touch Bar support (macOS only)
  touch_bar: ^0.3.0-alpha.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
