name: doudou
description: "Play your music with ease and style."
publish_to: 'none'
version: 11.0.0

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # HTTP requests
  dio: ^5.8.0
  http: ^1.6.0
  
  # Audio playbook - comprehensive cross-platform support
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_macos_audio: ^1.0.10+1
  media_kit_libs_linux: ^1.1.4
  media_kit_libs_ios_audio: ^1.0.1+5
  media_kit_libs_android_audio: ^1.0.2
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  wakelock_plus: ^1.4.0
  
  # Desktop system media controls (taskbar/system tray)
  audio_service_mpris: ^0.2.0       # Linux MPRIS (D-Bus media controls)
  audio_service_win: ^0.0.2         # Windows System Media Transport Controls
  
  # State management
  provider: ^6.1.5
  
  # RxDart for streams
  rxdart: ^0.28.0
  
  # URL launcher for opening downloads
  url_launcher: ^6.3.1
  
  # UI components
  cached_network_image: ^3.4.1
  
  # Storage and Caching
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.0+1
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_cache_manager: ^3.4.1
  
  # App info
  package_info_plus: ^9.0.0
  
  # Icons
  cupertino_icons: ^1.0.8
  logging: ^1.3.0
  flutter_svg: ^2.2.3
  
  # Cryptography
  crypto: ^3.0.7
  
  # Sharing and clipboard
  share_plus: ^12.0.1
  clipboard: ^0.1.3
  
  # Touch Bar support (macOS only)
  touch_bar: ^0.3.0-alpha.1
  
  # Haptic feedback
  vibration: ^3.1.4
  palette_generator: ^0.3.3+7
  
  # File picker for local music
  file_picker: ^8.1.7
  device_info_plus: ^11.3.3
  
  # Audio metadata extraction for embedded album art
  audiotags: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # Remove alpha channel for App Store compliance
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon.png"