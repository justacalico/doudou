name: doudou
description: Stream music correctly.
publish_to: "none"
version: 21.0.0

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  animations: ^2.0.11
  app_links: ^3.5.1
  archive: ^3.1.6
  audio_service: ^0.18.17
  audio_service_mpris: ^0.1.5
  audio_video_progress_bar: ^2.0.3
  phonic: ^1.3.0
  buttons_tabbar: ^1.3.13
  cached_network_image: ^3.4.0
  dio: ^5.7.0
  file_picker: ^8.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_carplay: ^1.5.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_lyric: ^2.0.4+6
  flutter_slidable: ^3.1.2
  get: ^4.7.1
  google_fonts: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.6
  jellyfin_dart: ^0.1.2
  ionicons_plus: ^0.2.5
  jni: ^0.14.0
  just_audio: ^0.9.46
  just_audio_media_kit:
    git:
      url: https://github.com/anandnet/just_audio_media_kit.git
      ref: 6672eb82657d9e671abbf42122031c88aa9e6d80
  palette_generator: ^0.3.3+4
  flutter_colorpicker: ^1.1.0
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.3.3
  shimmer: ^3.0.0
  sidebar_with_animation:
    git:
      url: https://github.com/anandnet/animated_side_bar.git
      branch: main
      ref: b53567a42b4ba3793a3cf00d478bdba0ecce33d7
  smtc_windows: ^0.1.2
  terminate_restart:
