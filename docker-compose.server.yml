services:
  doudou-server:
    image: registry.gitlab.com/openlyst/doudou/doudou-server:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: doudou-server
    restart: unless-stopped
    ports:
      - "8461:8461"
    volumes:
      - doudou-server-data:/data

volumes:
  doudou-server-data:
